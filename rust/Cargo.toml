# HermitCrab Rust engine — workspace root.
# See ../rust-conversion.md for the full plan (crate map: §5.1).
[workspace]
resolver = "2"
members = [
    "crates/pg-grammar",
    "crates/pg-featstruct",
    "crates/pg-shape",
    "crates/pg-foma",
    "crates/pg-fst",
    "crates/pg-rules",
    "crates/pg-memo",
    "crates/pg-parse",
    "crates/pg-ffi",
    "crates/pg-cli",
    "crates/pg-realize",
    "crates/pg-lexicon",
    "crates/pg-wasm",
    "crates/pg-snapshot",
    "crates/pg-fwdata",
    "crates/pg-conformance-fixtures",
    "crates/pg-grammar-gen",
    "crates/pg-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/sillsdev/machine"

# Shared dependency versions — pinned once here, referenced with `.workspace = true`.
[workspace.dependencies]
quick-xml = "0.37"
unicode-normalization = "0.1"
hashbrown = "0.15"
rustc-hash = "2"
bumpalo = "3"
smallvec = { version = "1", features = ["union", "const_generics"] }
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used by pg-conformance-fixtures to parse `words.yaml` (conformance fixture ground truth) —
# block-scalar-heavy hand-authored YAML that a hand-rolled parser would mishandle.
serde_yaml = "0.9"
# std::time::Instant is unimplemented (panics) on wasm32-unknown-unknown; web-time is a drop-in
# replacement (Performance.now()-backed there, a plain re-export of std elsewhere) for the two
# always-on O2 profiling counters (pg-fst::traverse, pg-rules::morph) that call Instant::now()
# unconditionally on every parse, not just when a profiling env var is read (see pg-wasm).
web-time = "1"
# `.pgpack` container (`pg-pack`, `openspec/changes/IMPLEMENTATION-READINESS.md` R2A): SHA-256
# structural-integrity digest over the container framing. Already present transitively in
# Cargo.lock (via `foma`'s own dependency graph) at this exact version before this crate added it
# as a direct dependency.
sha2 = "0.10"
# `.pgpack` container's optional publisher signature (R2A / `make-wasm-analysis-only` spec.md
# "Publisher signatures are optional offline provenance"). Not previously in the workspace lockfile
# for any crate; added here, pinned once, synced to Cargo.lock by this change.
ed25519-dalek = "2"
# `harden-foma-resource-safety` section 3 (`openspec/changes/IMPLEMENTATION-READINESS.md` R2): the
# compile-worker watchdog's sampled-RSS guardrail (`pg-foma/src/worker.rs`). Pinned per R2's exact
# wording ("a Rust-1.90-compatible `sysinfo` release"); refreshed only for the worker child's own
# PID (never a system-wide scan) -- see that module's own doc for why sampling is reported with its
# interval and observed peak, never as a hard memory ceiling.
sysinfo = "0.32"
# internal crates
pg-grammar = { path = "crates/pg-grammar" }
pg-featstruct = { path = "crates/pg-featstruct" }
pg-shape = { path = "crates/pg-shape" }
pg-foma = { path = "crates/pg-foma" }
pg-fst = { path = "crates/pg-fst" }
pg-rules = { path = "crates/pg-rules" }
pg-memo = { path = "crates/pg-memo" }
pg-parse = { path = "crates/pg-parse" }
pg-realize = { path = "crates/pg-realize" }
pg-lexicon = { path = "crates/pg-lexicon" }
pg-snapshot = { path = "crates/pg-snapshot" }
pg-fwdata = { path = "crates/pg-fwdata" }
pg-conformance-fixtures = { path = "crates/pg-conformance-fixtures" }
pg-grammar-gen = { path = "crates/pg-grammar-gen" }
# `.pgpack` container (R2A / `make-wasm-analysis-only`): ADR 0004 required-runtime-feature
# containment + ADR 0005 capability-trust stamp, consumed by `pg-wasm`'s load path (see that
# crate's `src/pack.rs`).
pg-pack = { path = "crates/pg-pack" }
# dev
criterion = "0.5"
proptest = "1"

# Release profile tuned for the FFI cdylib and CLI: max optimization, single codegen unit,
# fat LTO. panic = "unwind" is REQUIRED — pg-ffi relies on catch_unwind at the C boundary
# (rust-conversion.md §4.2, §8 layer 7); "abort" would break abort-safety.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# A faster-to-build optimized profile for iterating on benchmarks during development.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
