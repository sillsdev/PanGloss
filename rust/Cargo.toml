# HermitCrab Rust engine — workspace root.
# See ../rust-conversion.md for the full plan (crate map: §5.1).
[workspace]
resolver = "2"
members = [
    "crates/pg-grammar",
    "crates/pg-featstruct",
    "crates/pg-shape",
    "crates/pg-foma",
    "crates/pg-fst",
    "crates/pg-rules",
    "crates/pg-memo",
    "crates/pg-parse",
    "crates/pg-ffi",
    "crates/pg-cli",
    "crates/pg-realize",
    "crates/pg-lexicon",
    "crates/pg-wasm",
    "crates/pg-snapshot",
    "crates/pg-fwdata",
    "crates/pg-conformance-fixtures",
    "crates/pg-grammar-gen",
    "crates/pg-pack",
    "crates/pg-worker-containment",
    "crates/pg-assess",
    "crates/pg-stats",
]

# Doc-comment link integrity. `broken_intra_doc_links` only WARNS by default, and a warning nobody
# reads is not a check -- so it is denied here and every member crate opts in with `[lints] workspace
# = true`. A bare `[workspace.lints]` with no per-crate opt-in silently does nothing, which is worse
# than absent: a gate that looks enabled.
#
# This is load-bearing for the comment policy, not cosmetic. `.claude/skills/code-comments/SKILL.md`
# lets a comment block exceed three lines only if it carries a machine-checked anchor, and an
# intra-doc link is the cheapest such anchor -- so the anchor is only meaningful while something
# actually resolves it. `pg.ps1 -Mode doc` is what runs it; nothing else in the build invokes rustdoc.
#
# It catches renames and deletions, never semantic drift: `[`slot_candidates`]` still resolves after
# its behavior changes. That gap is closed by a test, not by a link.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# A parameter accepted and never read is a promise the signature cannot keep. `compose_budget` was
# threaded through four layers of `FomaProposer` and dropped; rustc warned on it for however long,
# and nobody read the warning. Denying it costs exactly that one fix and then the class cannot
# recur. It does NOT catch the neighbouring shapes -- a struct field dropped by a caller, or a
# registration nothing consults -- which need their own gates.
[workspace.lints.rust]
unused_variables = "deny"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/sillsdev/machine"

# Shared dependency versions — pinned once here, referenced with `.workspace = true`.
[workspace.dependencies]
quick-xml = "0.37"
unicode-normalization = "0.1"
hashbrown = "0.15"
rustc-hash = "2"
bumpalo = "3"
smallvec = { version = "1", features = ["union", "const_generics"] }
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used by pg-conformance-fixtures to parse `words.yaml` (conformance fixture ground truth) —
# block-scalar-heavy hand-authored YAML that a hand-rolled parser would mishandle.
serde_yaml = "0.9"
# std::time::Instant is unimplemented (panics) on wasm32-unknown-unknown; web-time is a drop-in
# replacement (Performance.now()-backed there, a plain re-export of std elsewhere) for the two
# always-on O2 profiling counters (pg-fst::traverse, pg-rules::morph) that call Instant::now()
# unconditionally on every parse, not just when a profiling env var is read (see pg-wasm).
web-time = "1"
# `.pgpack` container (`pg-pack`, `openspec/changes/IMPLEMENTATION-READINESS.md` R2A): SHA-256
# structural-integrity digest over the container framing. Already present transitively in
# Cargo.lock (via `foma`'s own dependency graph) at this exact version before this crate added it
# as a direct dependency.
sha2 = "0.10"
# `.pgpack` container's optional publisher signature (R2A / `make-wasm-analysis-only` spec.md
# "Publisher signatures are optional offline provenance"). Not previously in the workspace lockfile
# for any crate; added here, pinned once, synced to Cargo.lock by this change.
ed25519-dalek = "2"
# Native process-memory observation used by backend runtime diagnostics and the CLI recipe
# optimizer. Compile-worker execution limits are enforced independently of this dependency.
sysinfo = "0.32"
libc = "0.2"

# `pg-stats`' per-project statistics cache. `bundled` compiles SQLite from vendored C source so
# there is no system libsqlite3 to install or version-match across machines and worktrees.
rusqlite = { version = "0.32", features = ["bundled"] }
# internal crates
pg-grammar = { path = "crates/pg-grammar" }
pg-featstruct = { path = "crates/pg-featstruct" }
pg-shape = { path = "crates/pg-shape" }
pg-foma = { path = "crates/pg-foma" }
pg-fst = { path = "crates/pg-fst" }
pg-rules = { path = "crates/pg-rules" }
pg-memo = { path = "crates/pg-memo" }
pg-parse = { path = "crates/pg-parse" }
pg-realize = { path = "crates/pg-realize" }
pg-lexicon = { path = "crates/pg-lexicon" }
pg-snapshot = { path = "crates/pg-snapshot" }
pg-fwdata = { path = "crates/pg-fwdata" }
pg-assess = { path = "crates/pg-assess" }
pg-stats = { path = "crates/pg-stats" }
pg-conformance-fixtures = { path = "crates/pg-conformance-fixtures" }
pg-grammar-gen = { path = "crates/pg-grammar-gen" }
# `.pgpack` container (R2A / `make-wasm-analysis-only`): ADR 0004 required-runtime-feature
# containment, consumed by `pg-wasm`'s load path (see that crate's `src/pack.rs`).
pg-pack = { path = "crates/pg-pack" }
# Windows Job Object process-tree containment. The dependency is target-scoped in the crate so
# analysis-only and Linux builds do not acquire Windows APIs.
pg-worker-containment = { path = "crates/pg-worker-containment" }
# dev
criterion = "0.5"
proptest = "1"

# Dev profile: line tables instead of the default full DWARF/PDB. Debug info is the single largest
# thing a dev build writes -- full info across 20 crates plus their test binaries is gigabytes of
# scattered small writes into the target dir, and sustained I/O queue depth stalls a remote session
# (SSH round-trips, Chrome Remote Desktop frame delivery) faster than CPU load does. Line tables
# keep panic messages and backtraces pointing at real file:line, which is what this workspace's
# failures are actually diagnosed from; they do NOT support stepping in a debugger with local
# variable inspection. If you need that for a session, build that crate with
# `-Mode build -DebugProfile` plus `--config 'profile.dev.debug=2'` rather than changing this --
# it is the default precisely because nearly every build here never opens a debugger.
#
# Matches [profile.pg-test-opt]'s reasoning below, which reached the same conclusion for tests.
[profile.dev]
debug = "line-tables-only"

# Release profile tuned for the FFI cdylib and CLI: max optimization, single codegen unit,
# fat LTO. panic = "unwind" is REQUIRED — pg-ffi relies on catch_unwind at the C boundary
# (rust-conversion.md §4.2, §8 layer 7); "abort" would break abort-safety.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# A faster-to-build optimized profile for iterating on benchmarks during development.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16

# Broad test suites must not pay [profile.release]'s fat-LTO/single-codegen-unit link cost: this
# workspace produces hundreds of test binaries, and fat LTO is per-binary link work that dominates
# the run. rust/tools/pg.ps1's `test`/`corpus-test` modes pass `--profile pg-test-opt` (or nextest's
# `--cargo-profile pg-test-opt`) by default; only `-Mode release` uses [profile.release] itself, so
# actual deliverables and production-equivalent perf measurements keep fat LTO/codegen-units=1
# untouched above.
[profile.pg-test-opt]
inherits = "release"
lto = "thin"
codegen-units = 16
# Line tables, not full DWARF: keeps panic/backtrace locations useful for a failing corpus or perf
# gate without paying release's usual full debug-info cost across hundreds of test binaries.
debug = "line-tables-only"
