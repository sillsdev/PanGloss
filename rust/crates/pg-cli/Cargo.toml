[package]
name = "pg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pangloss"
path = "src/main.rs"

[features]
developer-tools = ["pg-foma/developer-tools"]
# Ground-truth allocator instrumentation for docs/research/word-memory-trace.md; default off, see
# `src/alloc_trace.rs`.
alloc-trace = []

[dependencies]
pg-parse.workspace = true
pg-grammar.workspace = true
pg-realize.workspace = true
pg-featstruct.workspace = true
pg-fst.workspace = true
pg-rules.workspace = true
pg-memo.workspace = true
pg-snapshot.workspace = true
pg-fwdata.workspace = true
# P3 (docs/fst-plan/foma-fst-plan.md): `--engine=foma` on `batch`/`parse` routes through
# `pg_foma::composite::FomaAnalyzer` instead of the default `pg_parse::Morpher` path.
pg-foma.workspace = true
pg-assess.workspace = true
pg-pack.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
# `coverage.rs` (capability-coverage VISIBILITY): replays the in-repo SYNTHETIC conformance
# fixtures (never real-language data) against `pg_parse::Morpher` to build the "passing conformance
# construct" set `pg_foma::coverage_ledger::build_ledger` needs, mirroring
# `pg-foma/tests/conformance_coverage_gate.rs`'s own dev-only helper as real (non-dev) CLI code.
pg-conformance-fixtures.workspace = true
# `make_report.rs` (`openspec/changes/certify-language-readiness` section 4): hashes the grammar/
# pack/corpus files a readiness report pins as its re-derivation record. Already a workspace
# dependency of `pg-pack` (its own `.pgpack` container digest) -- reused here rather than a second,
# independently-pinned copy.
sha2.workspace = true
sysinfo.workspace = true
# `stats_cmd.rs`: `batch --stats` and the `stats` subcommand read/write the per-project cache this
# crate owns.
pg-stats.workspace = true
# `stats_cmd.rs`'s `stats` subcommand reads the cache directly (bypassing
# `pg_stats::StatsCache::open`'s wipe-on-grammar-change gate, since a report-only read must never
# destroy data) via `pg_stats::report`'s `&rusqlite::Connection`-based queries.
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
# `winmem.rs`: real working-set measurement (`K32GetProcessMemoryInfo`), the ground truth
# `alloc-trace`'s requested-byte counter cannot give (docs/research/memory-measurement-repair.md).
# Target-scoped, matching `pg-worker-containment`'s existing windows-sys convention, so a non-Windows
# build acquires no Windows APIs.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
