[package]
name = "pg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pangloss"
path = "src/main.rs"

[dependencies]
pg-parse.workspace = true
pg-grammar.workspace = true
pg-realize.workspace = true
pg-featstruct.workspace = true
pg-fst.workspace = true
pg-rules.workspace = true
pg-snapshot.workspace = true
pg-fwdata.workspace = true
# P3 (docs/fst-plan/foma-fst-plan.md): `--engine=foma` on `batch`/`parse` routes through
# `pg_foma::composite::FomaAnalyzer` instead of the default `pg_parse::Morpher` path.
pg-foma.workspace = true
# `pack.rs` (ADR 0004/0005 close-the-loop step): `pangloss pack` writes a real `.pgpack` via
# `pg_pack::write_pack`, carrying the persistent ADR 0005 capability-trust stamp `--allow-unproven`
# previously only emitted as a session/report-level stderr marker.
pg-pack.workspace = true
rayon.workspace = true
# `diagnostics.rs` (`openspec/changes/add-grammar-diagnostics`): `build.json`/`assessment.json`
# canonical JSON. serde/serde_json are already pinned once at the workspace root (mirrors
# `pg-foma`'s own `health.rs` two-line pattern).
serde.workspace = true
serde_json.workspace = true
