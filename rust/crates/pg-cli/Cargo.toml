[package]
name = "pg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "pangloss"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/harnesses/all.rs"

[[test]]
name = "recipe_optimize_timeout"
path = "tests/recipe_optimize_timeout.rs"
required-features = ["foma-tools"]

[[test]]
name = "facts_command"
path = "tests/facts_command.rs"

[[test]]
name = "reserved_word_boundary"
path = "tests/reserved_word_boundary.rs"

[features]
examples = []
foma-tools = ["dep:pg-foma", "dep:pg-foma-backend", "pg-assess/foma-tools", "pg-pack/foma-tools"]
developer-tools = ["foma-tools", "pg-foma/developer-tools", "pg-foma-backend/developer-tools"]
# Ground-truth allocator instrumentation for docs/research/word-memory-trace.md; default off, see
# `src/alloc_trace.rs`.
alloc-trace = []

[[example]]
name = "spellcheck_measure"
path = "examples/spellcheck_measure.rs"
required-features = ["examples"]

[dependencies]
pg-parse.workspace = true
pg-grammar.workspace = true
pg-realize.workspace = true
pg-featstruct.workspace = true
pg-fst.workspace = true
pg-rules.workspace = true
pg-snapshot.workspace = true
pg-fwdata.workspace = true
# P3 (docs/fst-plan/foma-fst-plan.md): `--engine=foma` on `batch`/`parse` routes through
# `pg_foma::composite::FomaAnalyzer` instead of the default `pg_parse::Morpher` path.
pg-foma = { workspace = true, optional = true }
pg-foma-backend = { workspace = true, optional = true }
pg-assess.workspace = true
pg-facts.workspace = true
pg-pack.workspace = true
pg-worker-containment.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
# Coverage uses fixture discovery here and the backend's shared passing-evidence replay.
pg-conformance-fixtures.workspace = true
# `make_report.rs` (`openspec/changes/certify-language-readiness` section 4): hashes the grammar/
# pack/corpus files a readiness report pins as its re-derivation record. Already a workspace
# dependency of `pg-pack` (its own `.pgpack` container digest) -- reused here rather than a second,
# independently-pinned copy.
sha2.workspace = true
# `stats_cmd.rs`: `batch --stats` and the `stats` subcommand read/write the per-project cache this
# crate owns.
pg-stats.workspace = true
# `stats_cmd.rs`'s `stats` subcommand reads the cache directly (bypassing
# `pg_stats::StatsCache::open`'s wipe-on-grammar-change gate, since a report-only read must never
# destroy data) via `pg_stats::report`'s `&rusqlite::Connection`-based queries.
rusqlite.workspace = true
tempfile.workspace = true

# Target-scoped so non-Windows builds do not acquire Windows APIs; the file index identifies a hard-linked output.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
