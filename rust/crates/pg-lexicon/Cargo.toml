[package]
name = "pg-lexicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pg-grammar.workspace = true
pg-parse.workspace = true
# Needed to read `FeatureValue::Symbolic`/`SymbolBits` off `Grammar::fs_interner` entries directly
# (candidate-class POS extraction, disambiguating-form rule gating) -- pg-parse already depends on
# this crate directly for the identical reason (see its `morpher.rs`), so this is not a new engine
# dependency edge, just one pg-lexicon also needs named in its own `Cargo.toml`.
pg-featstruct.workspace = true
# Not a workspace-pinned dependency (no other in-workspace crate needs it yet); declared directly
# here the same way `pg-wasm/Cargo.toml` declares it for its own serde needs.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
