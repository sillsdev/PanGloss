[package]
name = "hc-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "hermit_crab"
# cdylib for P/Invoke from net48; rlib so hc integration tests can link it too.
crate-type = ["cdylib", "rlib"]

[dependencies]
hc-parse.workspace = true
hc-grammar.workspace = true

[dev-dependencies]
# Enables `hc_parse::batch::TEST_PANIC_WORD` for the abort-safety test only (Cargo feature
# unification means this activates `test-panic-hook` for `cargo test`'s build of hc-parse, but
# NEVER for a plain `cargo build`/`cargo build --release`, which does not build
# `[dev-dependencies]` at all — see hc-parse/Cargo.toml and `tests/abort_safety.rs`).
hc-parse = { workspace = true, features = ["test-panic-hook"] }
