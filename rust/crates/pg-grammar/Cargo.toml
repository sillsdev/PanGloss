[package]
name = "pg-grammar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `compile::test_support::assert_grammars_equal` is a field-for-field `Grammar` comparison with no
# construction authority, unlike pg-foma's `candidate_filter::test_support` (which can build a
# filter that deletes candidates) -- still feature-gated so no production build carries test-only
# comparison code, following the same self-dev-dependency pattern.
test-support = []

[dependencies]
pg-featstruct.workspace = true
pg-shape.workspace = true
pg-snapshot.workspace = true
quick-xml.workspace = true
unicode-normalization.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pg-conformance-fixtures.workspace = true
# grammar_health.rs's serialization round-trip test only; production code never needs JSON.
serde_json.workspace = true
# Enables this crate's own `test-support` feature for its test targets without offering it to any
# other crate -- same pattern as pg-foma's own self dev-dependency (see that crate's Cargo.toml).
pg-grammar = { path = ".", features = ["test-support"] }
# tests/conversion_inventory_gate.rs: measures the FieldWorks conversion-loss delta end to end
# (import through compile). No cycle: pg-fwdata depends only on pg-snapshot, never on pg-grammar.
pg-fwdata.workspace = true
# compile/tests.rs's circumfix-conditioning tests parse a compiled Grammar end to end; a
# dev-dependency cycle (pg-parse depends on pg-grammar normally) is fine since dev-deps are never
# built for pg-parse's own compile.
pg-parse.workspace = true

# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
