[package]
name = "pg-assess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pg-grammar.workspace = true
pg-parse.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# tests/duplicate_count_determinism.rs (task 1.12): drives the real propose->confirm composite
# analyzer, including its cross-word rayon confirm parallelism, to check whether AnalysisSet
# duplicate counts (and the semantic projection they feed) survive `analyze_words_with_threads`
# byte-identically. `test-concurrency-hook` is native-only, opt-in instrumentation owned by one
# analyzer. It rendezvous-synchronizes two tasks only when the batch and pool can support them;
# otherwise it records non-overlap without blocking. Unarmed analyzers remain unchanged.
pg-foma = { workspace = true, features = ["test-concurrency-hook"] }

# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
