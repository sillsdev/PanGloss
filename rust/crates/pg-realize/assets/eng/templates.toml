# Natural-phrases N2 (docs/natural-phrases-plan.md N2) embedded English construction-cell table
# for pg_realize::table::TableRealizer, loaded via include_str!.
#
# One entry per (CaseRole, Poss, Num) cell -- key = "Case.Poss.Num" (dotted, hence quoted --
# pg_realize::map's restricted-TOML-subset key rule requires quoting for keys with characters
# other than letters/digits/'_'/'-'). Value is an English template with exactly one `{n:sg}` or
# `{n:pl}` slot -- pg_realize::table::TableRealizer fills that slot with the concept's singular
# or plural noun form and leaves the rest of the template text verbatim.
#
# Mechanical construction rule (every cell below is generated by this rule, not hand-picked):
#   - noun-form slot: `{n:pl}` when Num=Pl, else `{n:sg}` (Sg and Unspec both use the singular
#     slot; Unspec additionally omits any indefinite article -- see below -- since "unspecified
#     number" is the bare citation form, not implicitly singular).
#   - possessor determiner: Poss=None contributes no determiner; every other Poss contributes its
#     possessive determiner word (P1Sg "my", P1Pl "our", P2SgM/P2SgF/P2Pl "your", P3SgM "his",
#     P3SgF "her", P3Pl "their"), always followed by a space, regardless of Num.
#   - indefinite article: only when Poss=None AND Num=Sg, a leading "a " is added (Poss=None,
#     Num=Pl gets no article since English bare plurals take none; Poss=None, Num=Unspec gets no
#     article either, by the rule above).
#   - case prefix: CaseRole=None contributes nothing; Loc/Abl/All contribute "in "/"from "/"to "
#     ahead of everything else.
# Concretely: value = case_prefix + (determiner_or_article) + noun_form_slot. This is the exact
# source a future N3 GF-generator run would overwrite (docs/natural-phrases-plan.md N3) -- kept
# fully explicit/enumerated here since the GF toolchain is not installed on this machine.

