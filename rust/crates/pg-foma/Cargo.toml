[package]
name = "pg-foma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-concurrency-hook = []

[dependencies]
# Pinned exact so a version bump is always deliberate and re-gated, not a silent float.
# Originally validated at 0.1.1 by gate F0 (docs/fst-plan/foma-fst-plan.md); re-validated at
# 0.4.0 (upstream's own wasm32 fix landed, retiring this repo's vendored patch — see the
# pg-foma test suite, especially tests/f5_diacritics_gate.rs, and the wasm32 checks in that gate).
# Bumped to 0.4.2 (2026-07-25, the tag-dropping-bug investigation): 0.4.1/0.4.2 are untrusted-input
# hardening fixes only (expand_unknowns @:? arc-count fix, io_net_read/cmatrix overflow guards,
# fsm_completes sparse-sigma stride fix) — byte-identical behavior for every previously-working
# net, so a clean, low-risk upgrade. Does NOT fix the `%0`-escape multichar-symbol sigma artifact
# filed as divvun/foma-rs (see `emit.rs`'s `verify_tags_reachable` doc) — confirmed unchanged on
# 0.4.2 by the same minimal repro; that fix is a workaround in this crate (`verify_tags_reachable`
# itself), not something this version bump resolves.
foma = "=0.4.2"
pg-grammar.workspace = true
pg-featstruct.workspace = true
# P1 stage 2 (docs/fst-plan/foma-fst-plan.md, Indonesian): the junction-aware emitter
# (`src/junctions.rs`) drives the real synthesis machinery to pre-probe surface variants, exactly
# like `hc-hybrid/src/surface.rs` does today. Both are already wasm-safe (pg-rules is in pg-wasm's
# dependency graph via pg-parse; see that crate's `web-time` use for the same `Instant`-on-wasm32
# fix pg-fst needed) -- `cargo check -p pg-foma --target wasm32-unknown-unknown` covers this.
pg-rules.workspace = true
pg-shape.workspace = true
rustc-hash.workspace = true
# `health.rs` (openspec/changes/define-fst-compilation-health): the FST compilation-health finding
# schema's canonical JSON. serde/serde_json are already pinned once at the workspace root (see
# `pg-snapshot`'s own Cargo.toml for the same two-line pattern).
serde.workspace = true
serde_json.workspace = true
# Stable evidence hashes for recipe-optimizer corpus certification.
sha2.workspace = true
# junctions.rs's alphabet probe loops (compute_variants/compute_deletion_junctions): parallelized
# across CPU cores on non-wasm32 targets via a dedicated large-stack pool (see
# `PhonologyProbe::new`'s doc) -- NOT used on wasm32-unknown-unknown, where `thread::spawn` (which
# a rayon pool needs to build) aborts at runtime; that path stays the original sequential loop
# (`#[cfg(target_arch = "wasm32")]`), mirroring `pg-parse/src/batch.rs`'s own scoped-pool pattern.
rayon.workspace = true
# P2 (docs/fst-plan/foma-fst-plan.md): confirm (`src/confirm.rs`) pins `Morpher::parse_word_selected`
# to a proposed candidate's root(s)/rules — this crate's whole propose->CONFIRM point — so pg-parse
# is now a normal (not dev-only) dependency. Not a new wasm32 risk: pg-wasm already links pg-parse
# directly (it IS the verifier engine pg-wasm's demo runs today), so pg-foma depending on it too adds
# no new transitive dependency to that build. `cargo check -p pg-foma --target wasm32-unknown-unknown`
# and the same for pg-wasm both stay part of this crate's gate.
pg-parse.workspace = true

# `harden-foma-resource-safety` section 3 (`openspec/changes/IMPLEMENTATION-READINESS.md` R2): the
# compile-worker watchdog (`src/worker.rs`) is entirely `#[cfg(not(target_arch = "wasm32"))]` --
# these three dependencies are scoped to the SAME target cfg here too (not merely dead code on
# wasm32, but genuinely ABSENT from `pg-wasm`'s dependency graph), mirroring R2's "WASM is
# analysis-only and needs no compile watchdog" / R2A's "WASM... dependency graph SHALL NOT contain
# FST compiler construction" ethos applied to this worker.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The compile worker's sampled-RSS guardrail (R2: "sampled RSS through a Rust-1.90-compatible
# `sysinfo` release"). Pinned once at the workspace root; see `worker.rs`'s own doc.
sysinfo.workspace = true
# The worker child's own `.xml`/`.json`/`.fwdata` grammar-source dispatch (`worker.rs`'s
# `load_grammar_for_worker`, mirroring `pg-cli::load_grammar`'s three-way extension dispatch so the
# worker protocol can name any of the three grammar-path shapes the CLI already accepts). Promoted
# from dev-only (below) to a real, non-wasm dependency by this change.
pg-snapshot.workspace = true
pg-fwdata.workspace = true

[dev-dependencies]
# Phase C (docs/fst-plan/phase-c-generator-design.md): the synthetic-grammar generator + its
# Morpher-as-generator oracle, used by tests/phase_c_*.rs (and tests/common/gate_template.rs).
# `features = ["oracle"]` because `pg-grammar-gen`'s own `pg-parse` dependency is feature-gated
# (see that crate's Cargo.toml) -- its default features alone don't build the oracle module.
pg-grammar-gen = { workspace = true, features = ["oracle"] }
# tests/conformance_coverage_gate.rs (task 5.1, ADR 0001's non-blocking conformance-coverage
# preview, `src/conformance_coverage.rs`): dual-root fixture discovery + `words.yaml` parsing.
# Dev-dependency only, same as every other example/test-only dependency above -- no cycle, since
# `pg-conformance-fixtures` depends on `pg-grammar`/`pg-parse` only, never back on this crate.
pg-conformance-fixtures.workspace = true
# tests/segment_natural_class_table_binding_discriminates.rs: inspects the `CompileNode` shape
# `pg_rules::bridge::PatternBridge::compile_pattern` returns, to compare a natural class's compiled
# constraint lanes under a correct-table vs. wrong-table resolution directly (rather than editing
# any crate's `src/`). Already a transitive dependency (via `pg-rules`/`pg-parse`) -- this only makes
# it nameable from this crate's own tests, same rationale as the other dev-only entries above.
pg-fst.workspace = true
