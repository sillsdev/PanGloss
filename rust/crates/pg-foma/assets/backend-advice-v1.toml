# Generic compiler evidence only.  Entries and remedies are sorted by their stable keys/ranks.
schema_version = 1

[[entry]]
shape_key = "backend-build-unavailable"
backend_id = "compiler-runtime"
route = "backend-construction"
failed_predicate = "the backend is unavailable or its compiler process failed"
evidence_refs = ["route:backend-construction", "predicate:backend-available", "metric:build-process-result"]
equivalence_caveat = "Don't make any change that would make your language invalid!"

[[entry]]
shape_key = "late-structural-reachability"
backend_id = "foma"
route = "surface-enumeration"
failed_predicate = "structural operation remains reachable after ordinary rule application"
evidence_refs = ["backend:foma", "route:surface-enumeration", "rule:structural-operation", "metric:reachable-state-count"]
equivalence_caveat = "Any grammar reordering requires a language-owner equivalence review."

[[entry.remedy]]
rank = 10
remedy_key = "order-rules"
description = "Order the ordinary and structural rules when the language licenses that order."
effort = "medium"
prerequisites = ["a proven linguistic ordering"]
contraindications = ["the grammar permits both orders"]
equivalence_caveat = "The compiler cannot establish linguistic equivalence for a changed order."

[[entry.remedy]]
rank = 20
remedy_key = "constrain-structural-reachability"
description = "Constrain the structural operation to the categories that are proven reachable."
effort = "hard"
prerequisites = ["a finite reachable-category certificate"]
contraindications = ["the operation is intended for every reachable category"]
equivalence_caveat = "A reachability constraint can remove analyses unless equivalence is established."

