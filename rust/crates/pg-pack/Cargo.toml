[package]
name = "pg-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
foma-tools = ["dep:foma"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `.pgpack` container digest (R2A): SHA-256 over the container framing bytes; also used to derive
# the anti-mix-across-grammars package fingerprint over both payloads.
sha2.workspace = true
# `.pgpack` optional publisher signature (R2A / make-wasm-analysis-only spec.md). See this crate's
# `signature.rs` module doc for exactly which bytes are signed and why no `rand`/`rand_core`
# dependency is needed (test keypairs are built from a fixed synthetic 32-byte seed via
# `SigningKey::from_bytes`, never a CSPRNG, since this crate never generates a "real" production
# keypair itself — that is external signing tooling's job per `make-wasm-analysis-only` design.md:
# "signing tooling accepts the private key outside the package").
ed25519-dalek.workspace = true
# Reuses `HealthReport`/`Severity`/admission and the backend compatibility-report shapes as-is for
# the manifest, rather than duplicating the schema. `pg-health` is plain data with no compiler or
# `foma` dependency, so this stays out of the Runtime's wasm32 build graph (see `pg-wasm`'s own
# Cargo.toml comment and `pg-wasm/tests/wasm_excludes_compiler.rs`).
pg-health.workspace = true

# Opt-in round-trip tests exercising REAL foma binary-memory bytes (gzip magic bytes, non-UTF8 content)
# instead of only the plain-ASCII synthetic byte-string fixtures this crate's tests otherwise use
# -- built directly via `foma::lexcread::fsm_lexc_parse_string` + `foma::io::fsm_write_binary`, the
# SAME functions `pg_foma::analyzer::FomaProposer::foma_binary_payload` calls in production. Pinned
# to the identical exact version `pg-foma` compiles against. Optional normal dependency enabled by `foma-tools`; this stays out of `pg-wasm`'s default build graph.
# Bumped to 0.4.2 alongside pg-foma's own Cargo.toml (2026-07-25) — see that file's comment.
foma = { version = "=0.4.2", optional = true }

# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
