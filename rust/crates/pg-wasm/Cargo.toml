[package]
name = "pg-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# cdylib for wasm-bindgen/wasm-pack; rlib so this crate's own `cargo test` runs natively too.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pg-grammar.workspace = true
pg-parse.workspace = true
pg-realize.workspace = true
pg-lexicon.workspace = true
# `.pgpack` load-time compatibility (ADR 0004 required ⊆ provided containment) -- see `src/pack.rs`.
# Reuses `pg-pack`'s manifest/compat types verbatim; this crate never redefines them.
pg-pack.workspace = true
# The compiler's health/backend-report/runtime-feature vocabulary as plain data -- NOT `pg-foma`
# itself, which carries `foma` (the FST compiler) unconditionally. Depending on `pg-health` instead
# is what keeps this crate's wasm32 build graph analysis-only; see `src/pack.rs`'s own doc and
# `tests/wasm_excludes_compiler.rs`.
pg-health.workspace = true
thiserror.workspace = true
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# std::time::Instant panics on wasm32-unknown-unknown -- same fix as pg-fst/pg-rules.
web-time.workspace = true
# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
