[package]
name = "pg-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pg-featstruct.workspace = true
pg-shape.workspace = true
pg-fst.workspace = true
pg-rules.workspace = true
pg-grammar.workspace = true
pg-memo.workspace = true
rustc-hash.workspace = true
unicode-normalization.workspace = true
bumpalo.workspace = true
smallvec.workspace = true
rayon.workspace = true
serde.workspace = true
# `identity.rs`'s canonical JSON form (`AnalysisIdentity::to_canonical_value`). Produced through
# serde rather than hand-built so a deserialized expectation and a projected analysis cannot drift
# into digesting differently -- see that module's own doc. Moved here with the module when it
# relocated out of `pg-assess` so `pg-foma` could share one projector without depending on the
# assessment layer.
serde_json.workspace = true

[dev-dependencies]
pg-conformance-fixtures.workspace = true

[features]
# OFF by default — never part of a normal `cargo build`. `pg-ffi`'s abort-safety test (plan §8
# layer 7, M8) enables this only via its own `[dev-dependencies]` entry, so it is compiled in for
# `cargo test` but never for the shipped `pangloss_ffi.dll` (`cargo build --release -p pg-ffi`
# builds only `[dependencies]`, never `[dev-dependencies]`). See `batch.rs::TEST_PANIC_WORD`.
test-panic-hook = []
