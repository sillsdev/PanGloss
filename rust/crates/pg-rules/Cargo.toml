[package]
name = "pg-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pg-featstruct.workspace = true
pg-shape.workspace = true
pg-fst.workspace = true
pg-grammar.workspace = true
pg-memo.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
rustc-hash.workspace = true
web-time.workspace = true

# `stats_calibrate`: real per-call timers for the `AnalysisPhase` sub-phase breakdown, compiled out
# by default so an ordinary build never reads the clock at a rule-application site.
[features]
stats-calibrate = []

# Opt in to [workspace.lints] (rustdoc::broken_intra_doc_links = deny).
[lints]
workspace = true
