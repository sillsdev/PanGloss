schema_version = 1

[scripts]
test = ".drover/scripts/test.ps1"

[run]
platforms = ["windows", "wsl"]
default = "windows"

[gate]
platform = "windows"
timeout_s = 5400
idle_s = 1800

[review]
model = "sonnet-5.5"
high_risk_model = "opus-5.5"

[land]
policy = "batch"
push = false

[cleanup]
disposable = [
  "rust/target",
  "rust/crates/*/target",
  "rust/examples/native-abi/csharp/bin",
  "rust/examples/native-abi/csharp/obj",
  "tools/xample-projector/bin",
  "tools/xample-projector/obj",
  "**/.venv",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/node_modules",
]
