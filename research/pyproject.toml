[project]
name = "spellcheck-research"
version = "0.1.0"
description = "Research harness for PanGloss spell-check / word-prediction model families (D4/D5, docs/research/spellcheck/PLAN.md)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
spellcheck-research = "spellcheck_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spellcheck_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: without this, a bare `python -m pytest` in a checkout that has not
# installed the package fails at collection with ModuleNotFoundError. `uv run` and
# an editable install both work regardless; this makes the bare invocation work too.
pythonpath = ["src"]
