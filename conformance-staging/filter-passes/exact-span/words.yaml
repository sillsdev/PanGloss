# oracle-provenance: founding-oracle machine-commit=f150e2a005ce639f7d68ef17fb0db25b2f6aaa3c verified-date=2026-09-16
# Candidate-filter per-pass fixture for local.exact_span.v1 -- see STAGING.md and grammar.xml's own
# header comment for the pathology and the isolation argument.
#
# The Stratum is morphologicalRuleOrder="unordered", the only order HCLoader ever emits
# (HCLoader.cs:227,230,374). The prefix and suffix rules commute, so "matinlu" and "makesalu" each get
# the identical signature twice -- oracle-attested (both derivations trace the same rules list), and
# exactly what a FieldWorks user sees: HCParser.ParseWord enumerates Morpher.ParseWord with no
# dedupe, and MergeEquivalentAnalyses prunes only the search, since Word.ExpandAlternatives
# re-expands every merged alternative before a result is yielded.

language: Matinlu
inspired_by: ["synthetic agglutinative grammar with no phonological alternation (not modeling any real language)"]
sources:
  - "docs/superpowers/specs/2026-08-11-candidate-filter-contract.md (impossible exact local surface span)"
requires: []
fieldworks_producible: true
fieldworks_producible_notes: >-
  Two freestanding derivational MorphologicalRules on one Unordered Stratum, exactly as
  LoadDerivAffixProcessRule adds them (HCLoader.cs:883-944); no AffixTemplate is involved. The
  duplicated identical parse of "matinlu" and "makesalu" each is the shape HCLoader-built grammars actually
  produce, not a defect. The candidate-filter pass local.exact_span.v1 judges each analysis on its own,
  so a duplicated positive control changes nothing it can discriminate, and the four expect_fail rows are unaffected, since whether fixed-shape pieces tile the surface does not depend on which order the engine tried them in.
words:
  - word: tin
    note: Bare root, spanning the whole surface on its own. Plain control.
    parses:
      - signature: "TIN|tin"
        rules: []

  - word: kesa
    note: Second bare root, a different length, so span arithmetic is not pinned to one size.
    parses:
      - signature: "KESA|kesa"
        rules: []

  - word: matin
    note: Prefix plus root, tiling the surface exactly.
    parses:
      - signature: "MA+TIN|matin"
        rules: [mrMa]

  - word: tinlu
    note: Root plus suffix, tiling the surface exactly.
    parses:
      - signature: "TIN+LU|tinlu"
        rules: [mrLu]

  - word: matinlu
    note: >-
      All three pieces, tiling the surface with nothing left over -- the row the target pass must
      never disturb, and the one every negative row below is a one-segment perturbation of.
    parses:
      - signature: "MA+TIN+LU|matinlu"
        rules: [mrMa, mrLu]
      - signature: "MA+TIN+LU|matinlu"
        rules: [mrMa, mrLu]

  - word: makesa
    note: Prefix plus the second root.
    parses:
      - signature: "MA+KESA|makesa"
        rules: [mrMa]

  - word: kesalu
    note: The second root plus suffix.
    parses:
      - signature: "KESA+LU|kesalu"
        rules: [mrLu]

  - word: makesalu
    note: All three pieces over the second root.
    parses:
      - signature: "MA+KESA+LU|makesalu"
        rules: [mrMa, mrLu]
      - signature: "MA+KESA+LU|makesalu"
        rules: [mrMa, mrLu]

  - word: matinolu
    note: >-
      THE distinguishing row: "matinlu" with one segment inserted between the root and the suffix.
      Every morpheme the surface suggests is legal, in the right order, on the right side, in the
      right category, and no grammar constraint of any other kind is violated -- the pieces simply
      cannot cover the surface, since the grammar declares no phonological or metathesis rule that
      could account for the extra segment.
    provenance: "candidate-filter contract: impossible exact local surface span"
    expect_fail: true
    blocked_by: [mrMa, mrLu]

  - word: matnlu
    note: >-
      The deletion counterpart: "matinlu" one segment short, so the proposed pieces overrun what is
      there. A pass that only detected uncovered surface would leave this row alive.
    provenance: "candidate-filter contract: impossible exact local surface span"
    expect_fail: true
    blocked_by: [mrMa, mrLu]

  - word: matinlua
    note: An extra segment past the end of the last morpheme rather than in the interior.
    provenance: "candidate-filter contract: impossible exact local surface span"
    expect_fail: true
    blocked_by: [mrMa, mrLu]

  - word: makesaluu
    note: The same overrun over the second root, so the pin does not rest on one entry.
    provenance: "candidate-filter contract: impossible exact local surface span"
    expect_fail: true
    blocked_by: [mrMa, mrLu]
