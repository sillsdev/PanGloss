# oracle-provenance: founding-oracle machine-commit=f150e2a005ce639f7d68ef17fb0db25b2f6aaa3c verified-date=2026-09-16
# Candidate-filter per-pass fixture for structural.transition.v1 -- see STAGING.md and grammar.xml's
# own header comment for the pathology and the isolation argument.
#
# The Stratum is morphologicalRuleOrder="unordered", the only order HCLoader ever emits
# (HCLoader.cs:227,230,374). The prefix and suffix rules commute, so "takolurmu" get
# the identical signature twice -- oracle-attested (both derivations trace the same rules list), and
# exactly what a FieldWorks user sees: HCParser.ParseWord enumerates Morpher.ParseWord with no
# dedupe, and MergeEquivalentAnalyses prunes only the search, since Word.ExpandAlternatives
# re-expands every merged alternative before a result is yielded.

language: Tekumar
inspired_by: ["synthetic prefix + suffix agglutinative grammar (not modeling any real language)"]
sources:
  - "docs/superpowers/specs/2026-08-11-candidate-filter-contract.md (forbidden morphotactic transition)"
requires: []
fieldworks_producible: true
fieldworks_producible_notes: >-
  Two freestanding derivational MorphologicalRules on one Unordered Stratum, exactly as
  LoadDerivAffixProcessRule adds them (HCLoader.cs:883-944); no AffixTemplate is involved. The
  duplicated identical parse of "takolurmu" is the shape HCLoader-built grammars actually
  produce, not a defect. The candidate-filter pass structural.transition.v1 judges each analysis on its own,
  so a duplicated positive control changes nothing it can discriminate, and the three expect_fail rows are unaffected, since an affix's sidedness is fixed by its own InsertSegments placement, not by application order.
words:
  - word: kolur
    note: Bare root, no transition to check. Plain control.
    parses:
      - signature: "KOLUR|kolur"
        rules: []

  - word: reka
    note: Second bare root.
    parses:
      - signature: "REKA|reka"
        rules: []

  - word: takolur
    note: Prefix strictly left of the root -- the legal prefix transition.
    parses:
      - signature: "TA+KOLUR|takolur"
        rules: [mrTa]

  - word: tareka
    note: The same legal prefix transition over the second root.
    parses:
      - signature: "TA+REKA|tareka"
        rules: [mrTa]

  - word: kolurmu
    note: Suffix strictly right of the root -- the legal suffix transition.
    parses:
      - signature: "KOLUR+MU|kolurmu"
        rules: [mrMu]

  - word: rekamu
    note: The same legal suffix transition over the second root.
    parses:
      - signature: "REKA+MU|rekamu"
        rules: [mrMu]

  - word: takolurmu
    note: Both affixes, each on its own side -- the row the target pass must never disturb.
    parses:
      - signature: "TA+KOLUR+MU|takolurmu"
        rules: [mrTa, mrMu]
      - signature: "TA+KOLUR+MU|takolurmu"
        rules: [mrTa, mrMu]

  - word: kolurta
    note: >-
      THE distinguishing row: the prefix rule's material to the RIGHT of the root. The morpheme
      sequence (KOLUR, TA) is unreachable in the morphotactic automaton whatever else is true of
      it, and nothing else in the grammar objects -- the segments are legal, the spans tile the
      surface exactly, there is one part of speech so no signature conflict exists, there is no
      AffixTemplate so no slot ordering exists, no co-occurrence rule mentions either morpheme, and
      each entry has one unconstrained allomorph.
    provenance: "candidate-filter contract: forbidden morphotactic transition"
    expect_fail: true
    blocked_by: [mrTa]

  - word: rekata
    note: The same wrong-side prefix over the second root, so the pin does not rest on one entry.
    provenance: "candidate-filter contract: forbidden morphotactic transition"
    expect_fail: true
    blocked_by: [mrTa]

  - word: mukolur
    note: >-
      The mirror-image violation: the suffix rule's material to the LEFT of the root. A pass that
      knew only one side of the automaton would leave this row alive.
    provenance: "candidate-filter contract: forbidden morphotactic transition"
    expect_fail: true
    blocked_by: [mrMu]
