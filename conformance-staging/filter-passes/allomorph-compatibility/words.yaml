# founding oracle) against a materialized edge-cases/<name> mirror of this fixture (Fixture.DiscoverAll
# only scans languages/edge-cases; the real files here were never moved) -- PASSED, every word's
# signature and traced rules: list matched. Any older "NOT the C# founding oracle" / "Oracle: pangloss"
# sentence below describes how this fixture was originally authored, not its current verification
# status -- superseded by the marker above.
# Candidate-filter per-pass fixture for local.allomorph.v1 -- see STAGING.md and grammar.xml's own
# header comment for the pathology and the isolation argument.
#
# Oracle: pangloss (`pg_parse::Morpher::parse_word`, driven directly rather than through the
# `pg-cli batch` binary), NOT the C# founding oracle. Every signature below was captured from this
# repo's own Rust engine and transcribed verbatim; nothing here was hand-derived. Machine
# acceptance must re-verify against `SIL.Machine.Morphology.HermitCrab.Tool`, and any divergence
