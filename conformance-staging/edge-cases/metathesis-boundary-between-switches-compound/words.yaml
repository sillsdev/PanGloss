# oracle-provenance: founding-oracle machine-commit=1ddef2bd verified-date=2026-11-19
language: MetathesisBoundaryBetweenSwitchesCompound
requires: [phonology]
fieldworks_producible: true
words:
  - word: "p"
    note: >-
      Root p alone: no compound, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
  - word: "t"
    note: >-
      Root t alone: no compound, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
  - word: "pp"
    note: >-
      Compound of p and p: no t-then-p pair, so nothing swaps.
    parses:
      - signature: "Y|p+?p"
        rules: [cr1]
  - word: "pt"
    note: >-
      Surface of the compound t then p with a junction boundary between the switches: the swap steps over the boundary and lists the morphs in surface order (Y+Z); C# returns the analysis twice.
    parses:
      - signature: "Y+Z|p+?t"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
      - signature: "Y+Z|p+?t"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
  - word: "tt"
    note: >-
      Compound of t and t: no p after the t, so nothing swaps.
    parses:
      - signature: "Z|t+?t"
        rules: [cr1]
  - word: "p+p"
    note: >-
      Compound of p and p with the junction boundary written: no swap.
    parses:
      - signature: "Y|p+?p"
        rules: [cr1]
  - word: "p+t"
    note: >-
      The pt surface with the junction boundary written: the same two analyses as pt.
    parses:
      - signature: "Y+Z|p+?t"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
      - signature: "Y+Z|p+?t"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
  - word: "t+t"
    note: >-
      Compound of t and t with the junction boundary written: no swap.
    parses:
      - signature: "Z|t+?t"
        rules: [cr1]
  - word: "tp"
    note: >-
      Never a surface: the obligatory rule rewrites tp to pt, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "t+p"
    note: >-
      Never a surface: the obligatory rule rewrites t+p to p+t, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
