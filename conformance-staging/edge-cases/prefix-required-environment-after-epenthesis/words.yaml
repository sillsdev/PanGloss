# oracle-provenance: founding-oracle machine-source=e63b8863 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-21, none taken from PanGloss)
# Pins the allomorph environment of a morph beside an epenthetic segment (prefix p requires s on its right; root sa st ta; one rule inserts a between p and s). C# reads a morph's environment from its
# annotation range, which never holds a node inserted at its edge, so `pasa` has no analysis; HC-Rust accepted it because the inserted segment sat inside the
# neighbouring morph's span. Every word of the 340-word probe space (length 1 to 4 over a p s t) that is not listed with a parse is pinned as expect_fail.
language: EpenthesisBesideMorphEnvironment
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 405 follow-up: C# AllomorphEnvironment.IsMatch reads morph.Range.End.Next / Start.Prev"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix, suffix and environments), HCLoader.LoadRewriteRule (epenthesis)"
requires: [phonology]
fieldworks_producible: false
fieldworks_producible_notes: "row 14 of fieldworks-cannot-say.md: a right-hand RequiredEnvironments on a lone prefix (HCLoader writes only a left environment for a prefix, folding the right side into the input pattern)"
