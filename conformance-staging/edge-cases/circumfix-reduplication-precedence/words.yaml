# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Oracle:
# pangloss (`pg_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section), NOT the
# C# founding oracle -- authored and verified against this repo's own Rust engine only. Signatures
# below are transcribed verbatim from that run, not hand-derived.

language: CircumfixReduplicationPrecedence
inspired_by: ["synthetic simultaneously-circumfixing-and-reduplicating probe (not modeling any real language)"]
sources:
  - "docs/conformance/circumfix-structural-composite-census.md (census C2)"
requires: []
words:
  - word: tam
    note: ROOTC2 bare, no mrCircRedup applied -- a plain control.
    parses:
      - signature: "ROOTC2|tam"
        rules: []

  - word: ketamtaman
    note: >-
      ROOTC2 + mrCircRedup's one allomorph: "ke" (leading insert) + "tam" (Copy p1, 1st) + "tam"
      (Copy p1, 2nd -- the reduplication-shaped part) + "an" (trailing insert). Before census C2's
      fix, `classify_affix`'s reduplication test ran unconditionally (before first_copy/last_copy
      were even computed) and returned Role::Reduplication immediately, so this allomorph was
      routed to `crate::peel::ReduplicationPeeler` -- whose four scan kinds are each a one-sided
      surface match and cannot recall a surface with independent material wrapping a reduplicated
      span on BOTH sides. After the fix, the leading-AND-trailing test wins, this classifies
      CircumfixPrefix, and the surface is reachable via `build_structural_composites`'s
      oracle-backed resynthesis instead.
    provenance: "docs/conformance/circumfix-structural-composite-census.md (census C2)"
    parses:
      - signature: "CIRCREDUP+ROOTC2|ketamtaman"
        rules: [mrCircRedup]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "AffixProcessRule: reduplication (ReduplicationHint)"
