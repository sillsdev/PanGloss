# Amharic-shaped pathology mimic -- see STAGING.md and grammar.xml's own header comment. Oracle:
# hc-rs (`hc_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section), NOT the
# C# founding oracle -- authored and verified against this repo's own Rust engine only. Signatures
# below are transcribed verbatim from that run, not hand-derived.

language: Gezmara
inspired_by: ["synthetic Amharic/Ge'ez-shaped infix + merged-letter-series probe (not modeling any real language)"]
sources:
  - "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row)"
requires: []
words:
  - word: kotab
    note: KTB bare root, no infix -- a plain control.
    parses:
      - signature: "KTB|kotab"
        rules: []

  - word: kpfotab
    note: >-
      KTB + mrPfv: the perfective infix "pf" inserted after the root's first consonant ("k"),
      InsertSegments around a root Copy -- exactly austronesian-phase's mrInfixUm shape, mimicking
      Ge'ez/Amharic-style templatic interdigitation.
    provenance: "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row): infix interdigitation"
    parses:
      - signature: "KTB+PFV|kpfotab"
        rules: [mrPfv]

  - word: kcvotab
    note: KTB + mrConv, the independent converb infix "cv" -- the same interdigitation mechanism, a different marker.
    provenance: "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row): infix interdigitation"
    parses:
      - signature: "KTB+CONV|kcvotab"
        rules: [mrConv]

  - word: ጸa
    note: >-
      TSU root, spelled with its ORIGINAL representation (ጸ). Bare-root control for the
      merged-letter-series pair below. The rendered signature shows the bracketed alternates class
      "[ጸፀ]" rather than a literal "ጸ" -- `cSTz`'s two representations are feature-identical (no
      other segment in this grammar shares its feature bundle), so the engine's shape-rendering
      correctly reports "this position matches either spelling of the merged segment", which is
      exactly the point being pinned.
    provenance: "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row): merged letter-series"
    parses:
      - signature: "TSU|[ጸፀ]a"
        rules: []

  - word: ፀa
    note: >-
      THE distinguishing row: the SAME underlying segment sequence as "ጸa" above, spelled with the
      OTHER representation (ፀ) of the merged cSTz segment -- parses to the IDENTICAL signature as
      "ጸa" (confirmed: both are "TSU|[ጸፀ]a"), proving the two orthographic representations are
      treated as one phoneme, not two distinct segments.
    provenance: "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row): merged letter-series (U+1338/U+1268 render-variant trap)"
    parses:
      - signature: "TSU|[ጸፀ]a"
        rules: []

  - word: ጸan
    note: TSU + mrGlyphSuf ("-n"), exercising the merged segment inside real morphology, not just a bare-root tokenization check.
    provenance: "docs/conformance-staging-plan.md pathology catalog (Amharic-shaped row): merged letter-series"
    parses:
      - signature: "TSU+GLYPHSUF|[ጸፀ]an"
        rules: [mrGlyphSuf]
