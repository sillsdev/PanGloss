# oracle-provenance: founding-oracle machine-commit=1ddef2bd verified-date=2026-11-19
language: MetathesisBoundaryBetweenSwitchesPrefix
requires: [phonology]
fieldworks_producible: true
words:
  - word: "p"
    note: >-
      Root p alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
  - word: "t"
    note: >-
      Root t alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
  - word: "ts"
    note: >-
      Surface of prefix s, a morph boundary, then root t: the switches are split by the boundary, the swap steps over it and the boundary stays between the swapped segments (t+?s).
    parses:
      - signature: "Z+PRE|t+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "sp"
    note: >-
      Prefix s then root p: p is not a switch target, so nothing swaps (PRE+Y).
    parses:
      - signature: "PRE+Y|s+?p"
        rules: [PRE]
  - word: "t+s"
    note: >-
      The same surface with the boundary written: C# accepts it and the boundary stays between the swapped segments.
    parses:
      - signature: "Z+PRE|t+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "s+p"
    note: >-
      Prefix s, boundary, root p: no swap, and the written boundary is the prefix boundary (PRE+Y).
    parses:
      - signature: "PRE+Y|s+?p"
        rules: [PRE]
  - word: "st"
    note: >-
      Never a surface: the obligatory rule rewrites st to ts, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "s+t"
    note: >-
      Never a surface: the obligatory rule rewrites s+t to t+s, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
