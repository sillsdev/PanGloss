# oracle-provenance: founding-oracle
# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Verified
# against the C# founding oracle (hc.dll, via hc-conformance.exe self-check): both signature strings
# match exactly. The `rules:` fields cannot be verified by that same self-check, for a structural
# reason (not a grammar or transcription defect): both declared parses render to the IDENTICAL
# signature "DAK+IMO|dakimo", so hc-conformance.exe's per-signature rule-attribution check
# (`Runner.cs`, grouping actual results by signature string) compares EACH declared parse against
# BOTH actual derivations sharing that signature -- for two derivations with genuinely different
# rule sets under one shared signature, this always reports exactly one mismatch per declared entry,
# regardless of which of the two correct rule-set assignments is chosen (verified empirically: swapping
# the assignment changes only which mismatch is reported, not whether one is). The `rules:` values
# below follow this fixture's own documented semantics instead (crLeftHead ~ root_index 0 ~ DAK-headed;
# crRightHead ~ root_index 1 ~ IMO-headed), the same ground truth `cross_compiler_equivalence_gate.rs`'s
# RED-2 test checks.
#
# IMPORTANT: this fixture's load-bearing pin (root_index discrimination) is NOT expressible in the
# `signature:` strings below -- `pg_parse::result_signature`/`BatchCommand.BuildSignature` joins bare
# `MorphemeId`s with no root marker, so both readings of `dakimo` (crLeftHead's dak-headed reading and
# crRightHead's imo-headed reading) render to the IDENTICAL string "DAK+IMO|dakimo". The two entries
# under `dakimo` below are therefore an ANNOTATION only (matching this suite's own documented
# "identical rendered signatures are kept not deduped" convention -- see `pg_parse::result_signature`'s
# doc comment and `identical_rendered_signatures_are_kept_not_deduped`) -- they pin that the oracle
# returns TWO analyses, not that those two analyses actually differ in headedness. The first-class,
# machine-checked assertion that the two analyses are genuinely distinct `AnalysisIdentity`s (same
# `morphemes`, same `category`, `root_index` 0 vs 1) lives in
# `rust/crates/pg-foma/tests/cross_compiler_equivalence_gate.rs`'s RED-2 test, which is what actually
# gates on the headedness discrimination this fixture exists to pin.

language: HeadAmbiguousCompounding
inspired_by: ["synthetic headedness-ambiguous compounding probe (not modeling any real language)"]
sources:
  - "rust/crates/pg-parse/src/identity.rs (AnalysisIdentity::root_index)"
  - "rust/crates/pg-foma/tests/cross_compiler_equivalence_gate.rs (RED-1's uflexc compound-loop fix)"
requires: []
words:
  - word: dak
    note: DAK bare root, no compounding -- a plain control.
    parses:
      - signature: "DAK|dak"
        rules: []

  - word: imo
    note: IMO bare root, no compounding -- a plain control.
    parses:
      - signature: "IMO|imo"
        rules: []

  - word: dakimo
    note: >-
      THE headedness-ambiguity witness. "dakimo" has exactly one morpheme split (DAK's lexical entry
      is the only 3-character prefix in the lexicon, IMO's the only matching remainder; see
      STAGING.md's "single-segmentation verification" for the explicit by-construction argument), so
      the ONLY remaining ambiguity is which morpheme is the compound's head/root. crLeftHead
      (head=posH=DAK, nonhead=posN=IMO, output copies head-then-nonhead) and crRightHead
      (head=posN=IMO, nonhead=posH=DAK, output copies nonhead-then-head) both instantiate to the same
      surface "dakimo" and the same output category posH, but crLeftHead's derivation has DAK as the
      head/root (root_index 0) and crRightHead's has IMO as the head/root (root_index 1). Both
      analyses render to the identical flat signature "DAK+IMO|dakimo" -- see this file's header note
      and STAGING.md for why the real assertion is a dedicated Rust test, not this signature string.
    provenance: "rust/crates/pg-parse/src/identity.rs AnalysisIdentity::root_index"
    parses:
      - signature: "DAK+IMO|dakimo"
        rules: [crLeftHead]
      - signature: "DAK+IMO|dakimo"
        rules: [crRightHead]

  - word: imodak
    note: >-
      Negative control: the mirror-order concatenation. Both compounding rules here always copy
      material in an order that yields "dakimo" (crLeftHead: head-then-nonhead = DAK-then-IMO;
      crRightHead: nonhead-then-head = DAK-then-IMO), so neither rule -- nor any other combination of
      the two lexical entries -- ever produces "imodak". Proves the two mirrored rules do not also
      license the reverse surface order, keeping the fixture's ambiguity confined to headedness alone.
    provenance: "rust/crates/pg-parse/src/identity.rs AnalysisIdentity::root_index"
    expect_fail: true
    blocked_by: [crLeftHead, crRightHead]
