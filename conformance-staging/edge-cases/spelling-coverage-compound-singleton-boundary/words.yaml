# oracle-provenance: founding-oracle
# Machine 1ddef2bd2f1503717de95556116df8e4a63846d6; suite a0094a3f97ddaa4a4dc4c4718ba6ea44869e254d.
language: SpellingCompoundSingletonBoundary
requires: [morpher-settings]
morpher:
  MaxRoots: 2
fieldworks_producible: true
words:
  - word: "a+a"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X|a+?a"
        rules: ["cr1"]
      - signature: "X|a+?a"
        rules: ["cr2"]
  - word: "a+p"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X+Y|a+?p"
        rules: ["cr1"]
      - signature: "X+Y|a+?p"
        rules: ["cr2"]
  - word: "p+a"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "Y+X|p+?a"
        rules: ["cr1"]
      - signature: "Y+X|p+?a"
        rules: ["cr2"]
  - word: "p+p"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "Y|p+?p"
        rules: ["cr1"]
      - signature: "Y|p+?p"
        rules: ["cr2"]
  - word: "a+sa"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X+PRE|a+?sa"
        rules: ["PRE", "cr2"]
  - word: "a+sp"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X+PRE+Y|a+?sp"
        rules: ["PRE", "cr2"]
  - word: "a+a+a"
    note: Pinned C# occurrence and rule-trace multiset.
    expect_fail: true
  - word: "ap"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X+Y|a+?p"
        rules: ["cr1"]
      - signature: "X+Y|a+?p"
        rules: ["cr2"]
