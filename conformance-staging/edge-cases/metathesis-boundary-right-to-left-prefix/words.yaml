# oracle-provenance: founding-oracle machine-commit=1ddef2bd verified-date=2026-11-19
language: MetathesisBoundaryRightToLeftPrefix
requires: [phonology]
fieldworks_producible: true
words:
  - word: "p"
    note: >-
      Root p alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
  - word: "t"
    note: >-
      Root t alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
  - word: "ts"
    note: >-
      Right-to-left rule on prefix s, boundary, root t: the boundary joins the group of the later switch; only segments move, so s moves after t and the boundary, which stays in place, comes first (+?ts), and C# lists the morphs PRE+Z.
    parses:
      - signature: "PRE+Z|+?ts"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "+ts"
    note: >-
      The same surface with the moved boundary written first: C# accepts it.
    parses:
      - signature: "PRE+Z|+?ts"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "sp"
    note: >-
      Prefix s then root p: p is not a switch target, so nothing swaps (PRE+Y).
    parses:
      - signature: "PRE+Y|s+?p"
        rules: [PRE]
  - word: "s+p"
    note: >-
      Prefix s, boundary, root p: no swap.
    parses:
      - signature: "PRE+Y|s+?p"
        rules: [PRE]
  - word: "sa"
    note: >-
      Prefix s then root a: a is not a switch target, so nothing swaps (PRE+X).
    parses:
      - signature: "PRE+X|s+?a"
        rules: [PRE]
  - word: "t+s"
    note: >-
      Rejected: in a right-to-left application s moves after t and the boundary, which stays in front of the pair, so it cannot stay between the swapped segments.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "st"
    note: >-
      Never a surface: the obligatory rule rewrites st to ts, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "s+t"
    note: >-
      Never a surface: the obligatory rule rewrites s+t to +ts, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
