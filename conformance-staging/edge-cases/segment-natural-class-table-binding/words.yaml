# oracle-provenance: founding-oracle
# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Verified
# against the C# founding oracle (hc.dll, via hc-conformance.exe self-check) after the grammar was
# fixed to be loadable (PartsOfSpeech must precede PhonologicalFeatureSystem; PhonologicalSubrule
# carries no `id` attribute in hc.dll's DTD).
#
# DIVERGENCE FROM HC-RUST FOUND HERE: word "g" was authored (against `pg_parse::Morpher`) with a
# single expected analysis, "ROOT2|g". The founding oracle instead reports TWO analyses for "g":
# "ROOT1|z" (in addition to "ROOT2|g") -- i.e. hc.dll's own SegmentNaturalClass resolution for the
# Outer stratum's `prKtoG` rule ALSO fires on ROOT1's Inner-stratum material ("z"), exactly the
# wrong-table collision this fixture was designed to prove COULD NEVER happen (ncK's member "k" sits
# at t1 raw index 0, which t0's "z" also occupies, with the OPPOSITE feature value). Per this repo's
# oracle hierarchy (CLAUDE.md), hc.dll is ground truth: `words.yaml` now records BOTH analyses, and
# `pg_parse::Morpher`'s own single-analysis behavior for "g" is a divergence from the founding
# oracle, not a correctness fix -- see `rust/crates/pg-parse/tests/conformance_fixtures_gate.rs` for
# whether HC-Rust reproduces this second analysis.

language: SegmentNaturalClassTableBinding
inspired_by: ["synthetic bistratal segment-natural-class-table-resolution probe (not modeling any real language)"]
sources:
  - "docs/conformance/representative-typology-basis.md S1.2.5 (Multi-table: shared-representation-across-tables configuration)"
  - "rust/crates/pg-rules/src/cache.rs owning_table_tests module"
requires: [phonology]
words:
  - word: g
    note: >-
      ROOT2, entered directly on the Outer stratum (table t1), correctly devoiced -- er, voiced --
      by the Outer stratum's own obligatory "k -> g" phonological rule. The rule's own natural
      classes (`ncK`={k}, `ncG`={g}) are `SegmentNaturalClass`, whose members are raw per-table
      `CharDefId`s with no table of their own (`pg_rules::bridge::PatternBridge::nat_class_lanes`'s
      `NaturalClassKind::Segments` branch resolves them via `self.table`, unlike a
      `FeatureNaturalClass`, whose lanes are table-agnostic -- see `rust/crates/pg-rules/src/
      cache.rs`'s `owning_table_tests` module doc for why that distinction matters). `ncK`'s one
      member ("k") sits at t1's raw index 0, which t0 (the OTHER table) also has an entry at --
      "z", carrying the OPPOSITE feature value (f=+ vs. "k"'s f=-) -- deliberately, so a
      wrong-table (table-0) resolution of `ncK` could never match a real t1-native "k" at all. This
      is the fixture that a table-agnostic `FeatureNaturalClass`-only suite could never have caught:
      every existing multi-table fixture (two-table-shared-representation-recall, multi-table-
      metathesis-shared-representation, bistratal-overlapping-segment-representation) builds its
      rules from `FeatureNaturalClass` only, so none of them can detect a wrong-table char-def
      resolution -- see `rust/crates/pg-foma/tests/segment_natural_class_table_binding_discriminates.rs`
      for the direct demonstration that this fixture's own `SegmentNaturalClass` WOULD catch it.
      FOUNDING-ORACLE FINDING (see this file's header): hc.dll itself ALSO produces the wrong-table
      analysis "ROOT1|z" for this word, alongside the intended "ROOT2|g" -- the collision this
      fixture set out to prove impossible is, per the founding oracle, a real ambiguity. Both
      analyses are recorded below as ground truth.
    provenance: "rust/crates/pg-rules/src/cache.rs owning_table_tests module"
    parses:
      - signature: "ROOT1|z"
        rules: [prKtoG]
        exercises:
          - "CharacterDefinitionTable: more than one table, one per stratum"
          - "NaturalClass: Segments vs FeatureNaturalClass/SegmentNaturalClass precision"
      - signature: "ROOT2|g"
        rules: [prKtoG]
        exercises:
          - "CharacterDefinitionTable: more than one table, one per stratum"
          - "NaturalClass: Segments vs FeatureNaturalClass/SegmentNaturalClass precision"

  - word: k
    note: >-
      ROOT2's own raw (unvoiced) spelling -- the phonological rule is obligatory (phonological
      rules always apply where their context matches, no optionality), so this must never be a
      valid surface form.
    provenance: "rust/crates/pg-rules/src/cache.rs owning_table_tests module"
    expect_fail: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"
      - "NaturalClass: Segments vs FeatureNaturalClass/SegmentNaturalClass precision"

  - word: z
    note: >-
      ROOT1, entered on the Inner stratum (table t0) -- a same-table, rule-untouched decoy proving
      the "more than one table, one per stratum" construct has genuine substance on BOTH tables, not
      merely the rule-bearing one. Per this codebase's own surface-tokenization convention (the
      initial input string is segmented ONLY against the grammar's LAST stratum's table, t1 here,
      which does not declare "z" at all -- the same architectural fact
      `bistratal-overlapping-segment-representation`'s own STAGING.md and
      `two_table_symbol_divergence.rs`'s module doc already document), a bare Inner-stratum root can
      never itself be a complete, tokenizable surface word in this architecture. Pinned honestly as
      SKIPPED (invalid shape), not silently omitted.
    provenance: "conformance-staging/edge-cases/bistratal-overlapping-segment-representation/STAGING.md"
    expect_skip: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"

  - word: gk
    note: >-
      A well-formed string over t1's own alphabet ("g"/"k" both legitimate t1 segments) that is
      simply not any lexical entry's own shape -- a plain negative control proving t1's inventory
      coverage alone doesn't manufacture spurious analyses.
    expect_fail: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"
