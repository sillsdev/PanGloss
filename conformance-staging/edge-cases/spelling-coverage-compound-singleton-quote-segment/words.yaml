# oracle-provenance: founding-oracle
# Machine 1ddef2bd2f1503717de95556116df8e4a63846d6; suite a0094a3f97ddaa4a4dc4c4718ba6ea44869e254d.
language: SpellingCompoundSingletonQuoteSegment
requires: [morpher-settings]
morpher:
  MaxRoots: 2
fieldworks_producible: true
words:
  - word: "a"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X|a"
        rules: []
  - word: "a\""
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "W|a[\"p]"
        rules: []
      - signature: "X+Y|a+?[\"p]"
        rules: ["cr1"]
      - signature: "X+Y|a+?[\"p]"
        rules: ["cr2"]
  - word: "pa\""
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "Y+W|[\"p]+?a[\"p]"
        rules: ["cr1"]
      - signature: "Y+W|[\"p]+?a[\"p]"
        rules: ["cr2"]
  - word: "a\"+p"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "W+Y|a[\"p]+?[\"p]"
        rules: ["cr1"]
      - signature: "W+Y|a[\"p]+?[\"p]"
        rules: ["cr2"]
  - word: "s\"a"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "PRE+X|s[\"p]a"
        rules: ["PRE"]
  - word: "as\"p"
    note: Pinned C# occurrence and rule-trace multiset.
    parses:
      - signature: "X+PRE+Y|a+?s[\"p][\"p]"
        rules: ["PRE", "cr2"]
  - word: "s\"s\"s\"a"
    note: Pinned C# occurrence and rule-trace multiset.
    expect_fail: true
  - word: "a\"aa"
    note: Pinned C# occurrence and rule-trace multiset.
    expect_fail: true
