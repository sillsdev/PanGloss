# oracle-provenance: founding-oracle machine-commit=aab4c59819adb7b366915e09df2fb28c62b8c03a verified-date=2026-11-01
# Every row replayed on hc.dll (SIL.Machine.Morphology.HermitCrab.Tool) built at the commit above, through
# machine/conformance/adapters/hc-dotnet-wrapper.sh; pangloss gives the same signature for every row.
language: CopyAgreementFeaturelessRedup
inspired_by: ["synthetic CV reduplication in a grammar with no phonological features (not modeling any real language)"]
sources:
  - "AnalysisMorphologicalTransform.cs HasDisagreeingCopies/CanAlign (machine aab4c598), lines 65-165"
requires: [phonology]
fieldworks_producible: true
fieldworks_producible_notes: >-
  Reduplication is a FieldWorks affix process with two copy mappings of one input part, and a
  project with an empty phonological feature system is the ordinary featureless project.
  tools/xample-projector `author` cannot back this grammar out: it accepts one input sequence and
  two output actions (insert plus copy), never a repeated copy, so there is no fieldworks/ witness.
words:
  - word: tasi
    note: >-
      plain root; the reduplication rule is not applied.
    parses:
      - signature: "tasi|tasi"
        rules: []
  - word: tatasi
    note: >-
      agreeing copies (ta, ta) in front of root tasi.
    parses:
      - signature: "RED+tasi|tatasi"
        rules: [mrRed]
  - word: pasa
    note: >-
      plain root control.
    parses:
      - signature: "pasa|pasa"
        rules: []
  - word: papasa
    note: >-
      agreeing copies (pa, pa) in front of root pasa.
    parses:
      - signature: "RED+pasa|papasa"
        rules: [mrRed]
  - word: pasasa
    note: >-
      pa then sa disagree on the consonant: no parse.
    expect_fail: true
  - word: pasapa
    note: >-
      pa then sa disagree: no parse.
    expect_fail: true
  - word: tatika
    note: >-
      ta then ti disagree on the vowel: no parse.
    expect_fail: true
  - word: tatisa
    note: >-
      ta then ti disagree on the vowel, whatever the rewrite does: no parse.
    expect_fail: true
  - word: tusa
    note: >-
      root tuka; the vowel has two spellings (u and ú), and the rewrite k to s between vowels applies.
    parses:
      - signature: "tuka|t[uú]sa"
        rules: [prLen]
  - word: tutusa
    note: >-
      agreeing copies (tu, tu) in front of root tuka, whose k is rewritten to s.
    parses:
      - signature: "RED+tuka|t[uú]t[uú]sa"
        rules: [mrRed, prLen]
  - word: tutúsa
    note: >-
      the two copies are spelled u and ú: one segment with two spellings, so they agree.
    parses:
      - signature: "RED+tuka|t[uú]t[uú]sa"
        rules: [mrRed, prLen]
  - word: tuúsa
    note: >-
      no root and no agreeing copies: no parse.
    expect_fail: true
  - word: sasa
    note: >-
      the copies agree but there is no root sa: no parse.
    expect_fail: true
  - word: titasi
    note: >-
      ti then ta disagree: no parse, though tasi is a root.
    expect_fail: true
  - word: tasitasi
    note: >-
      the rule copies only the first consonant and vowel, not the whole root: no parse.
    expect_fail: true
  - word: kakasi
    note: >-
      the copies agree but there is no root kasi: no parse.
    expect_fail: true
  - word: kata
    note: >-
      plain root control; its k is word-initial, so the rewrite does not apply.
    parses:
      - signature: "kata|kata"
        rules: []
  - word: kasata
    note: >-
      RED + kata. The surface copies are ka and sa, but the rewrite k to s between vowels explains the second, so un-applying it makes the copies agree. A fix that compared surface characters would wrongly refuse this analysis.
    parses:
      - signature: "RED+kata|kasata"
        rules: [mrRed, prLen]
  - word: kakata
    note: >-
      the rewrite is obligatory, so the unrewritten surface kakata has no parse.
    expect_fail: true
