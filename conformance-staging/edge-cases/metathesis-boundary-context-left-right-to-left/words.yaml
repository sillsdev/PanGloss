# oracle-provenance: founding-oracle machine-commit=1ddef2bd verified-date=2026-11-19
language: MetathesisBoundaryContextLeftRightToLeft
requires: [phonology]
fieldworks_producible: true
words:
  - word: "a"
    note: >-
      Root a alone: no s-t pair, nothing swaps.
    parses:
      - signature: "X|a"
        rules: []
  - word: "p"
    note: >-
      Root p alone: nothing swaps.
    parses:
      - signature: "Y|p"
        rules: []
  - word: "st"
    note: >-
      Root st alone: the rule needs a preceding a, so st is not swapped.
    parses:
      - signature: "Z|st"
        rules: []
  - word: "aa"
    note: >-
      Prefix a+ with root a: no s-t pair (PRE+X).
    parses:
      - signature: "PRE+X|a+?a"
        rules: [PRE]
  - word: "ap"
    note: >-
      Prefix a+ with root p: no s-t pair (PRE+Y).
    parses:
      - signature: "PRE+Y|a+?p"
        rules: [PRE]
  - word: "a+a"
    note: >-
      Prefix a, boundary, root a: the boundary is optional on the surface.
    parses:
      - signature: "PRE+X|a+?a"
        rules: [PRE]
  - word: "a+p"
    note: >-
      Prefix a, boundary, root p.
    parses:
      - signature: "PRE+Y|a+?p"
        rules: [PRE]
  - word: "ats"
    note: >-
      Right-to-left rule a _ [s t] over prefix a+ and root st: traversal meets t, then s, then steps over the boundary, which C# gives to s's group; only segments move, so t moves in front of the boundary and the surface is at+s.
    parses:
      - signature: "PRE+Z|at+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "at+s"
    note: >-
      The same analysis with the moved boundary written before s: C# accepts it.
    parses:
      - signature: "PRE+Z|at+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
  - word: "a+ts"
    note: >-
      The boundary left after the context, where the pre-fix Rust HC put it: C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "a+st"
    note: >-
      Never a surface: the obligatory rule rewrites a+st, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "ast"
    note: >-
      Never a surface: the obligatory rule rewrites it, and C# rejects it.
    expect_fail: true
    exercises: ["MetathesisRule"]
