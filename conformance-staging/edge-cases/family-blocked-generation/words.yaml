language: FamilyBlockedGeneration
inspired_by: ["synthetic stem family whose relative blocks a derivation"]
sources: ["sillsdev/PanGloss#423"]
requires: [morphology]
fieldworks_producible: true
words:
  - word: aa
    note: "The bare family member A."
