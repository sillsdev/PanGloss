# oracle-provenance: forward-synthesis
# (Forward-derived expectations; NOT recorded from hc.dll. hc.dll currently disagrees on kita.)
# Rule t i k -> k i t with a middle context. Synthesis reorders root tika into kita, leaving the
# i in its slot, so both roots KITA and TIKA surface as kita. The correct analysis of kita is
# therefore both KITA (unchanged) and TIKA (reorder undone). hc.dll finds only KITA: its
# AnalysisMetathesisRuleSpec drops the middle context from the search pattern (a C# defect, filed as
# sillsdev/machine#619). PanGloss is correct and differs from hc.dll until that is fixed (divergence 127).
# Remove the known-divergence entry when machine#619 lands and the oracle pin moves.
language: MetathesisMiddleContext
inspired_by: ["synthetic metathesis probe (not modeling any real language)"]
sources:
  - "src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/AnalysisMetathesisRuleSpec.cs"
  - "src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/SynthesisMetathesisRuleSpec.cs"
requires: [phonology]
fieldworks_producible: true
words:
  - word: kita
    note: >-
      Roots KITA and TIKA both surface as kita (TIKA by the rule, KITA unchanged). Forward
      synthesis gives both analyses; hc.dll finds only KITA (machine#619).
    parses:
      - signature: "KITA|kita"
        rules: []
      - signature: "TIKA|kita"
        rules: [mt]
  - word: tika
    note: >-
      Root TIKA is always reordered, so tika is not a word.
    expect_fail: true
