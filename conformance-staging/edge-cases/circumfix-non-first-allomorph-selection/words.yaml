# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Oracle:
# pangloss (`pg_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section), NOT the
# C# founding oracle -- authored and verified against this repo's own Rust engine only. Signatures
# below are transcribed verbatim from that run, not hand-derived.

language: NonFirstAllomorphCircumfixSelection
inspired_by: ["synthetic non-first-allomorph circumfix probe (not modeling any real language)"]
sources:
  - "docs/conformance/circumfix-structural-composite-census.md (census C1)"
requires: []
words:
  - word: mit
    note: ROOT bare, no mrMixed applied -- a plain control.
    parses:
      - signature: "ROOT|mit"
        rules: []

  - word: mits
    note: >-
      ROOT + mrMixed's allomorph 0 (subSuffix, an ORDINARY suffix). Alone, this allomorph would
      classify Role::Suffix -- exercised here to prove the ordinary allomorph still rides along
      once the rule is admitted (over-inclusion is safe, census's own "opposite order is safe"
      observation, just mirrored for the reverse declaration order).
    provenance: "docs/conformance/circumfix-structural-composite-census.md (census C1)"
    parses:
      - signature: "ROOT+MIXED|mits"
        rules: [mrMixed]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: kemitan
    note: >-
      ROOT + mrMixed's allomorph 1 (subCircum, the CIRCUMFIX -- "ke-...-an" wrapping the root on
      both sides). Declared SECOND in grammar.xml: before census C1's fix, `rule_role`'s
      first-allomorph-only classification never saw this shape at all, so `is_structural_rule`
      never routed mrMixed through `build_structural_composites` and this exact surface was
      unreachable from the proposer -- an honest, fail-closed recall gap, not a wrong compile.
    provenance: "docs/conformance/circumfix-structural-composite-census.md (census C1)"
    parses:
      - signature: "MIXED+ROOT|kemitan"
        rules: [mrMixed]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
