# oracle-provenance: founding-oracle machine-commit=1ddef2bd verified-date=2026-11-19
language: MetathesisMorphOrderCompound
requires: [phonology]
fieldworks_producible: true
words:
  - word: "p"
    note: >-
      Root p alone: no compound, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
  - word: "t"
    note: >-
      Root t alone: no compound, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
  - word: "pp"
    note: >-
      Compound of p and p: neither order forms the t-then-p switch pair, so nothing swaps.
    parses:
      - signature: "Y|pp"
        rules: [cr1]
  - word: "pt"
    note: >-
      Surface of the compound t then p with no boundary written: the swap crosses the compound junction and the morphs are listed in surface order (Y+Z); C# returns the analysis twice.
    parses:
      - signature: "Y+Z|pt"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
      - signature: "Y+Z|pt"
        rules: [cr1, pr1]
        exercises: ["MetathesisRule"]
  - word: "tt"
    note: >-
      Compound of t and t: no p after the t, so nothing swaps.
    parses:
      - signature: "Z|tt"
        rules: [cr1]
