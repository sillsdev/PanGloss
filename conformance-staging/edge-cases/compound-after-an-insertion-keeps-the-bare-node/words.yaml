# oracle-provenance: founding-oracle machine-source=1ddef2bd (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-21, none taken from PanGloss)
# Pins compound after an insertion keeps the bare node (a prefix, roots, an epenthesis rule and a later compounding rule). C# re-marks morphs after a compounding rule from the copied annotations, so an inserted node at a morph edge stays outside every morph; `tpasta` is the probe word.
# a Rust port that clears the bare marks on a compound rebuild counts the inserted node as part of its neighbour. Every word of the 2116-word probe space that is not listed with a parse is pinned as expect_fail.
language: CompoundAfterInsertion
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "C# SynthesisMetathesisRuleSpec.ApplyRhs, AnnotationList.cs:131-138"
  - "FieldWorks HCLoader.LoadAffixProcessRule, LoadRewriteRule (epenthesis), LoadCompoundingRule"
requires: [phonology]
fieldworks_producible: true
