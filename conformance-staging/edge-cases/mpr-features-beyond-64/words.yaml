# oracle-provenance: founding-oracle
# C# hc replay and hc-conformance self-check; synthetic data only. See STAGING.md.
language: MprFeaturesBeyond64
inspired_by: ["an exception-feature list longer than 64 entries, as a FieldWorks project can hold"]
sources: ["sillsdev/pangloss#150"]
