# oracle-provenance: forward-synthesis
# PanGloss-expected answers: a deliberate, recorded divergence from hc.dll (docs/divergences/129-*.md,
# policy "partial-feature grammars"). This fixture is RED against hc.dll on purpose; do not "fix" it back.
# hc.dll's answers (hc-conformance self-check, in-process Morpher, machine pin 4d9b454d, 2026-11-05) are
# in STAGING.md and pinned in rust/tools/oracle-conformance-known-divergences.json.
#
# prDel: [nasal:-] -> (deleted), no environment. The vowel a has no nasal value. hc.dll's synthesis
# match is subsumption, so its target does not match a and only p and t are deleted (ata -> aa). PanGloss
# matches by unification, so the unspecified a satisfies [nasal:-] and every segment of ata and pa is
# deleted: the rule is obligatory, so aa and a never parse, and neither do ata or pa.
language: UnspecifiedFeatureMinusTarget
inspired_by: ["synthetic obligatory consonant deletion (not modeling any real language)"]
sources:
  - "src/SIL.Machine/FeatureModel/FeatureStruct.cs"
  - "src/SIL.Machine/FiniteState/Input.cs"
requires: [phonology]
fieldworks_producible: true
words:
  - word: aa
    note: >-
      hc.dll: ata with its t deleted, both a survive. PanGloss: a is deleted too, so nothing derives aa.
    expect_fail: true
  - word: a
    note: >-
      hc.dll: pa with its p deleted. PanGloss: a is deleted too, so nothing derives a.
    expect_fail: true
  - word: ata
    note: >-
      The rule is obligatory: t never survives.
    expect_fail: true
  - word: pa
    note: >-
      The rule is obligatory: p never survives.
    expect_fail: true
