# oracle-provenance: founding-oracle machine-commit=4823a05a65aaecf5fde23d713b47b398458a0140 verified-date=2026-09-04
#
# Final-template partial discriminators. See grammar.xml's own header for the full design and the
# gate mechanics (SynthesisAffixProcessRule.cs's NonPartialRuleProhibitedAfterFinalTemplate and
# NonPartialRuleRequiredAfterNonFinalTemplate, and SynthesisAffixTemplatesRule.cs's line-59
# partial-word pass-through, pinned by pilfbvb and nibgi below).
#
# The original eight words' signatures were first transcribed from a throwaway pg-parse test
# (rust/crates/pg-parse/tests/zz_throwaway_final_template_partial_discriminators.rs, deleted after
# transcription) driving pg_parse::Morpher::parse_word directly (HC-Rust), then verified against the
# C# founding oracle. pilfbvb and nibgi were added directly against the oracle (derived from a
# close reading of SynthesisAffixProcessRule.cs/SynthesisAffixTemplatesRule.cs/
# SynthesisStratumRule.cs, then confirmed, not guessed and checked after the fact):
# `hc-conformance.exe --fixtures <scratch> --propose --capabilities ""` self-check reported PASS on
# every word below with zero proposed changes -- HC-Rust and the C# oracle agree on all ten words,
# no divergence found. Both new words' red-on-revert mutations (mrGate2Partial's and
# mrGate3Partial's own partial="true" each flipped to partial="false", one at a time, each
# reverted) were also run against this same oracle, not just HC-Rust; see STAGING.md for the exact
# before/after outputs.
#
# What each word isolates (Branch A = posX/root dak = NonPartialRuleProhibitedAfterFinalTemplate;
# Branch B = posY/root pil = NonPartialRuleRequiredAfterNonFinalTemplate; Branch C = posZ/root nib
# = SynthesisAffixTemplatesRule.cs line-59's partial-word pass-through):
#   dakfaga     Case 1 (Blocked). mrGate1 (ordinary, non-partial) tried right after finalTemplateA
#               (final="true"). Flips if finalTemplateA's own final="true" is changed to
#               final="false" (see nonFinalTemplateA's own mutation below for the actual
#               red-on-revert target, chosen to avoid breaking every other Branch-A word at once).
#   dakfa       Case 1 control. finalTemplateA alone, no mrGate1: proves the template path itself
#               works and dakfaga's failure is really the gate, not a broken template.
#   daknagafa   Case 2 (Control/Permitted). The SAME mrGate1 tried right after nonFinalTemplateA
#               (final="false") instead, then finalTemplateA closes the derivation. Flips if
#               nonFinalTemplateA's own final="false" is changed to final="true": this is the
#               red-on-revert target for gate 1 (see STAGING.md).
#   dakna       Negative control mirroring morphotactic-attribute-breadth's own kulpu: an
#               AffixTemplate@final="false" output alone is never a complete word (no fixture-wide
#               way to close a derivation except through a final template), so nonFinalTemplateA's
#               own output with no closing rule has no parse.
#   pilnbvbfb   Case 3 (Blocked). mrGate2Partial (ordinary, partial="true") tried right after
#               nonFinalTemplateB (final="false"), then finTagB closes what would otherwise be the
#               derivation. Flips if mrGate2Partial's own partial="true" is changed to partial="false"
#               (or removed): this is the red-on-revert target for gate 2 (see STAGING.md).
#   pilnbtbfb   Case 4 (Control/Permitted). mrGate2Complete (ordinary, NOT partial) tried in the
#               identical position, then finTagB closes the derivation.
#   pilnb       Negative control mirroring dakna: nonFinalTemplateB's own output alone, no closing
#               rule, has no parse.
#   pilfb       Case 3/4 control. finalTemplateB alone, no Branch-B ordinary rule: proves the
#               template path itself works.
#   pilfbvb     Case 5 (POSITIVE, partial-dependent): mrGate2Partial (partial="true") tried right
#               after finalTemplateB, i.e. the mirror of dakfaga with a partial rule instead of
#               mrGate1. Flips to zero analyses if mrGate2Partial's own partial="true" is changed
#               to partial="false" (see red-on-revert below) -- NonPartialRuleProhibitedAfterFinalTemplate
#               then fires exactly as it does for dakfaga. Exists to let FST recall be measured: an
#               under-proposing backend could silently lose this parse.
#   nibgi       Case 6 (POSITIVE, partial-dependent), Branch C (posZ, root nib): mrGate3Partial
#               (partial="true") makes the word partial; templateZ is applicable to posZ but its
#               one mandatory slot's rule (mrZTagSlot) can never match, so the template battery
#               yields zero output. Because the word is partial, SynthesisAffixTemplatesRule.cs's
#               line-59 pass-through takes its ELSE arm and the word survives unchanged. Flips to
#               zero analyses if mrGate3Partial's own partial="true" is changed to partial="false"
#               (see red-on-revert below): line 59's `!input.IsPartial && applicableTemplate` is
#               then true and the word dies with ApplicableTemplatesNotApplied instead.

language: FinalTemplatePartialDiscriminators
inspired_by: ["synthetic final-template partial-rule discriminator probe (not modeling any real language)"]
sources:
  - "SIL.Machine.Morphology.HermitCrab.Conformance/SemanticCoverage/EngineGateInventoryLedgerTests.cs: NonPartialRuleRequiredAfterNonFinalTemplate listed as an unreached gate in the real corpus (no existing fixture combines partial=\"true\" with an AffixTemplate final=\"false\" template)"
requires: []
fieldworks_producible: true
words:
  - word: dakfaga
    note: >-
      Case 1 (Blocked): mrGate1 (ordinary, non-partial) tried immediately after finalTemplateA
      (final="true") applied. NonPartialRuleProhibitedAfterFinalTemplate refuses it, so this string
      has no analysis.
    expect_fail: true
    blocked_by: [mrGate1]

  - word: dakfa
    note: Case 1 control. finalTemplateA alone (no mrGate1), proving the template path itself works.
    parses:
      - signature: "DAK+FINTAGA|dakfa"
        rules: [mrFinTagA]

  - word: daknagafa
    note: >-
      Case 2 (Permitted): the SAME mrGate1 tried immediately after nonFinalTemplateA (final="false")
      instead of finalTemplateA. NonPartialRuleProhibitedAfterFinalTemplate does not fire (the last
      applied rule was not a final template), so mrGate1 attaches; finalTemplateA then closes the
      derivation.
    parses:
      - signature: "DAK+NONFINTAGA+GATE1+FINTAGA|daknagafa"
        rules: [mrNonFinTagA, mrGate1, mrFinTagA]

  - word: dakna
    note: >-
      Negative control: nonFinalTemplateA's own output alone (no rule closes it with a final
      template) is never a complete word.
    expect_fail: true
    neutralizes:
      - finalTemplateA

  - word: pilnbvbfb
    note: >-
      Case 3 (Blocked): mrGate2Partial (ordinary, partial="true") tried immediately after
      nonFinalTemplateB (final="false") applied. NonPartialRuleRequiredAfterNonFinalTemplate refuses
      it (a partial rule cannot complete a non-final-template derivation), so this string has no
      analysis.
    expect_fail: true
    blocked_by: [mrGate2Partial]

  - word: pilnbtbfb
    note: >-
      Case 4 (Permitted): mrGate2Complete (ordinary, NOT partial) tried in the identical position.
      NonPartialRuleRequiredAfterNonFinalTemplate does not fire (the rule itself is not partial), so
      it attaches; finalTemplateB then closes the derivation.
    parses:
      - signature: "PIL+NONFINTAGB+GATE2COMPLETE+FINTAGB|pilnbtbfb"
        rules: [mrNonFinTagB, mrGate2Complete, mrFinTagB]

  - word: pilnb
    note: >-
      Negative control: nonFinalTemplateB's own output alone (no rule closes it with a final
      template) is never a complete word.
    expect_fail: true
    neutralizes:
      - finalTemplateB

  - word: pilfb
    note: Case 3/4 control. finalTemplateB alone (no Branch-B ordinary rule), proving the template path itself works.
    parses:
      - signature: "PIL+FINTAGB|pilfb"
        rules: [mrFinTagB]

  - word: pilfbvb
    note: >-
      Case 5 (POSITIVE, partial-dependent): mrGate2Partial (ordinary, partial="true") tried
      immediately after finalTemplateB (final="true") applied -- the mirror of dakfaga with a
      partial rule in mrGate1's position. NonPartialRuleProhibitedAfterFinalTemplate does not fire
      (the rule itself is partial), so it attaches and the derivation is already closed
      (IsLastAppliedRuleFinal stays true, inherited from finalTemplateB). This parse exists ONLY
      because mrGate2Partial is partial; it is the positive case that lets FST recall be measured.
    parses:
      - signature: "PIL+FINTAGB+GATE2PARTIAL|pilfbvb"
        rules: [mrFinTagB, mrGate2Partial]

  - word: nibgi
    note: >-
      Case 6 (POSITIVE, partial-dependent), Branch C (posZ, root nib): mrGate3Partial (ordinary,
      partial="true") applies to the root, making the WORD partial. templateZ is applicable to
      posZ (POS matches) but its one mandatory slot's rule (mrZTagSlot) can never match "nibgi"
      (it requires the last segment to be "k"), so the template battery yields zero output.
      Because the word is partial, SynthesisAffixTemplatesRule.cs's line-59 pass-through
      (`!input.IsPartial && applicableTemplate`) takes its ELSE arm: the word passes through
      unchanged, closing the derivation with no template morpheme contributed. This parse exists
      ONLY because the word is partial when the empty battery is reached.
    parses:
      - signature: "NIB+GATE3PARTIAL|nibgi"
        rules: [mrGate3Partial]
