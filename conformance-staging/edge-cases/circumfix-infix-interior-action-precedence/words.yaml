# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Oracle:
# pangloss (`pg_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section), NOT the
# C# founding oracle -- authored and verified against this repo's own Rust engine only. Signatures
# below are transcribed verbatim from that run, not hand-derived.

language: CircumfixInfixInteriorActionPrecedence
inspired_by: ["synthetic simultaneously-circumfixing-and-infixing probe (not modeling any real language)"]
sources:
  - "docs/conformance/circumfix-structural-composite-census.md (census C3)"
requires: []
words:
  - word: bat
    note: ROOT2 bare, no mrCircInfix applied -- a plain control.
    parses:
      - signature: "ROOT2|bat"
        rules: []

  - word: kebzatan
    note: >-
      ROOT2 + mrCircInfix's one allomorph: "ke" (leading insert) + "b" (Copy p1) + "z" (interior
      insert -- the infix-shaped part) + "at" (Copy p2) + "an" (trailing insert). Before census
      C3's fix, `classify_affix`'s interior-action test saw the "z" insert strictly between the two
      Copy actions and returned Role::Infix immediately, so this allomorph was routed to
      `crate::preexpand` -- which cannot represent a root wrapped on both sides at all. After the
      fix, the leading-AND-trailing test wins, this classifies CircumfixPrefix, and the surface is
      reachable only via `build_structural_composites`'s oracle-backed resynthesis.
    provenance: "docs/conformance/circumfix-structural-composite-census.md (census C3)"
    parses:
      - signature: "CIRCINFIX+ROOT2|kebzatan"
        rules: [mrCircInfix]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
