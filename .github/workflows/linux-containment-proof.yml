name: Disposable Linux containment proof

on:
  push:
    branches:
      - ci/linux-containment-proof

permissions:
  contents: read

jobs:
  linux-containment:
    name: Linux containment (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PANGLOSS_CGROUP_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove delegated cgroup containment
        working-directory: rust
        run: bash tools/linux-containment-ci.sh
