name: Release

# Pushing an annotated vX.Y.Z tag from main is the release action. The tag commit already contains
# the stamped workspace version and lockfile; this workflow verifies both before running gates.
# workflow_dispatch is a rehearsal for an explicit ref and version and never publishes.
# Prereleases are unsupported: only numeric vX.Y.Z tags trigger this workflow.
#
# The conformance gate is machine/conformance: all-synthetic fixtures diffed against committed
# ground truth. Real-language corpora (Sena, Amharic, Aweti, Indonesian) are gitignored local files
# and deliberately absent from release gates. Coverage and corpus details are appended to release
# notes because CI no longer writes them into a tag annotation.

on:
  push:
    # GitHub filters use globs, not regular expressions. Resolve v* tags here and enforce the
    # numeric vX.Y.Z format in the first job before any gates or builds run.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, x.y.z (CHANGELOG.md must already have its section)'
        required: true
        type: string
      ref:
        description: 'Branch, tag, or commit to rehearse (must be reachable from origin/main)'
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: resolve source and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      require_annotated_tag: ${{ steps.resolve.outputs.require_annotated_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve the release source
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_REF: ${{ inputs.ref }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_name=""
          require_annotated_tag=false

          if [[ "$EVENT_NAME" == push ]]; then
            tag_name="$PUSHED_TAG"
            if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags must be numeric vX.Y.Z; prereleases are unsupported"
              exit 1
            fi
            version="${tag_name#v}"
            source_sha="$GITHUB_SHA"
            require_annotated_tag=true
          else
            version="$REQUESTED_VERSION"
            source_ref="$REQUESTED_REF"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::rehearsal version must be exactly x.y.z with numeric components'
              exit 1
            fi
            if [[ -z "$source_ref" ]]; then
              echo '::error::rehearsal requires an explicit source ref'
              exit 1
            fi

            if [[ "$source_ref" == refs/tags/* ]]; then
              tag_name="${source_ref#refs/tags/}"
            elif [[ "$source_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag_name="$source_ref"
              source_ref="refs/tags/$tag_name"
            elif [[ "$source_ref" == refs/heads/* ]]; then
              source_ref="${source_ref#refs/heads/}"
            fi

            if [[ -n "$tag_name" ]]; then
              if [[ "$tag_name" != "v$version" ]]; then
                echo "::error::rehearsal ref $tag_name does not match requested version v$version"
                exit 1
              fi
              if ! git fetch --quiet origin "$source_ref:$source_ref"; then
                echo "::error::could not fetch rehearsal tag $tag_name from origin"
                exit 1
              fi
              if ! source_sha="$(git rev-parse "$source_ref^{commit}")"; then
                echo "::error::rehearsal tag $tag_name does not resolve to a commit"
                exit 1
              fi
              require_annotated_tag=true
            elif [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
              if ! git fetch --quiet --no-tags origin "$source_ref"; then
                echo "::error::could not fetch rehearsal commit $source_ref from origin"
                exit 1
              fi
              if ! source_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"; then
                echo "::error::rehearsal ref $source_ref does not resolve to a commit"
                exit 1
              fi
            else
              if [[ "$source_ref" == refs/* ]] || ! git check-ref-format "refs/heads/$source_ref"; then
                echo "::error::invalid rehearsal ref '$REQUESTED_REF'"
                exit 1
              fi
              if ! git fetch --quiet --no-tags origin "refs/heads/$source_ref:refs/remotes/origin/rehearsal"; then
                echo "::error::could not fetch rehearsal branch '$source_ref' from origin"
                exit 1
              fi
              if ! source_sha="$(git rev-parse 'refs/remotes/origin/rehearsal^{commit}')"; then
                echo "::error::rehearsal branch '$source_ref' does not resolve to a commit"
                exit 1
              fi
            fi
          fi

          if [[ -n "$tag_name" && "$tag_name" != "v$version" ]]; then
            echo "::error::tag $tag_name does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "require_annotated_tag=$require_annotated_tag" >> "$GITHUB_OUTPUT"
          echo "resolved $source_sha for v$version${tag_name:+ ($tag_name)}"

  gates:
    name: gates
    needs: resolve
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      actions: read
      contents: read
    with:
      include_release_gates: true
      version: ${{ needs.resolve.outputs.version }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      source_tag: ${{ needs.resolve.outputs.tag_name }}
      require_annotated_tag: ${{ needs.resolve.outputs.require_annotated_tag == 'true' }}
      timeout_minutes: 120

  build:
    name: ${{ matrix.asset }} (${{ matrix.target }})
    needs: [resolve, gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pangloss.exe
            asset: pangloss-win-x64.exe
            artifact: pangloss-win-x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: pangloss
            asset: pangloss-linux-x64
            artifact: pangloss-linux-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: pangloss
            asset: pangloss-osx-arm64
            artifact: pangloss-osx-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            binary: pangloss
            asset: pangloss-osx-x64
            artifact: pangloss-osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build pg-cli
        working-directory: rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release -p pg-cli --locked --target "$TARGET"

      - name: Smoke-test the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $source = Join-Path 'rust/target' "$env:TARGET/release/pangloss.exe"
          if (-not (Test-Path -LiteralPath $source)) { Write-Host "::error::missing target binary $source"; exit 1 }
          $smokeBinary = Join-Path $env:RUNNER_TEMP 'pangloss-smoke.exe'
          Copy-Item -LiteralPath $source -Destination $smokeBinary -Force
          $actual = ((& $smokeBinary --version) -join "`n").TrimEnd([char[]](13, 10))
          if ($LASTEXITCODE -ne 0 -or $actual -cne "pangloss $env:RELEASE_VERSION") {
            Write-Host "::error::expected 'pangloss $env:RELEASE_VERSION', got '$actual' (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "smoke passed: $actual ($env:TARGET)"

      - name: Smoke-test the Unix target binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          source="rust/target/$TARGET/release/$BINARY"
          test -f "$source"
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then suffix=".exe"; fi
          smoke_binary="$RUNNER_TEMP/pangloss-smoke$suffix"
          cp "$source" "$smoke_binary"

          if [[ "$TARGET" == x86_64-apple-darwin && "$(uname -m)" == arm64 ]]; then
            if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            actual="$(arch -x86_64 "$smoke_binary" --version)"
          else
            actual="$("$smoke_binary" --version)"
          fi
          expected="pangloss $RELEASE_VERSION"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::expected '$expected', got '$actual'"
            exit 1
          fi
          echo "smoke passed: $actual ($TARGET)"

      - name: Stage Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $binary = Join-Path $env:RUNNER_TEMP 'pangloss-smoke.exe'
          $asset = Join-Path $dist $env:ASSET_NAME
          Copy-Item -LiteralPath $binary -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$asset" + '.sha256'
          [System.IO.File]::WriteAllText($checksum, $hash)
          Copy-Item -LiteralPath $asset -Destination (Join-Path $dist 'pangloss.exe')
          Copy-Item -LiteralPath $checksum -Destination (Join-Path $dist 'pangloss.exe.sha256')

      - name: Stage Linux assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/release-assets"
          mkdir -p "$dist"
          cp "$RUNNER_TEMP/pangloss-smoke" "$dist/$ASSET_NAME"
          sha256sum "$dist/$ASSET_NAME" | awk '{print $1}' > "$dist/$ASSET_NAME.sha256"

      - name: Stage macOS assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/release-assets"
          mkdir -p "$dist"
          cp "$RUNNER_TEMP/pangloss-smoke" "$dist/$ASSET_NAME"
          shasum -a 256 "$dist/$ASSET_NAME" | awk '{print $1}' > "$dist/$ASSET_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: verify and publish release
    needs: [resolve, gates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pangloss-*
          path: release-assets
          merge-multiple: true

      - name: Verify all ten local release files and notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::invalid release version'; exit 1; }

          expected_files=(
            pangloss-win-x64.exe pangloss-win-x64.exe.sha256
            pangloss-linux-x64 pangloss-linux-x64.sha256
            pangloss-osx-arm64 pangloss-osx-arm64.sha256
            pangloss-osx-x64 pangloss-osx-x64.sha256
            pangloss.exe pangloss.exe.sha256
          )
          mapfile -t expected < <(printf '%s\n' "${expected_files[@]}" | sort)
          mapfile -t actual < <(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf '::error::unexpected release asset inventory\nexpected:\n%s\nactual:\n%s\n' \
              "$(printf '%s\n' "${expected[@]}")" "$(printf '%s\n' "${actual[@]}")"
            exit 1
          fi

          for asset in pangloss-win-x64.exe pangloss-linux-x64 pangloss-osx-arm64 pangloss-osx-x64 pangloss.exe; do
            actual_hash="$(sha256sum "release-assets/$asset" | cut -d ' ' -f 1)"
            recorded_hash="$(cat "release-assets/$asset.sha256")"
            if [[ ! "$recorded_hash" =~ ^[0-9a-f]{64}$ || "$recorded_hash" != "$actual_hash" ]]; then
              echo "::error::checksum mismatch for $asset"
              exit 1
            fi
          done
          cmp --silent release-assets/pangloss-win-x64.exe release-assets/pangloss.exe || {
            echo '::error::legacy pangloss.exe differs from pangloss-win-x64.exe'; exit 1;
          }
          cmp --silent release-assets/pangloss-win-x64.exe.sha256 release-assets/pangloss.exe.sha256 || {
            echo '::error::legacy Windows checksum differs from its platform asset'; exit 1;
          }

          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { found=1; next }
            /^## / { if (found) exit; found=0 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::release notes for $RELEASE_VERSION are empty"
            exit 1
          fi

          cat >> release-notes.md <<'EOF'

          Coverage: Rust CI (fmt, clippy, cargo test), release gates (comment hygiene, rustdoc, machine/conformance: all-synthetic fixtures diffed against committed ground truth), and smoke-checked Windows x64, Linux x64, macOS arm64, and macOS x64 builds.

          Real-language corpora (Sena, Amharic, Aweti, Indonesian) are gitignored local files and are deliberately absent from release gates.
          EOF

      - name: Create or resume the draft and publish verified assets
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          tag_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          releases_endpoint="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          release_create_endpoint="repos/$GITHUB_REPOSITORY/releases"
          release_id_script="$GITHUB_WORKSPACE/.github/scripts/release_id.py"
          export RELEASE_TITLE="PanGloss $tag"
          export RELEASE_TAG="${{ needs.resolve.outputs.tag_name }}"
          export RELEASE_NOTES_PATH=release-notes.md
          export RELEASE_ASSETS_DIR=release-assets

          cat > "$RUNNER_TEMP/verify_release.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          release = json.load(open("release.json", encoding="utf-8"))
          notes = Path(os.environ["RELEASE_NOTES_PATH"]).read_text(encoding="utf-8")
          if release.get("tag_name") != f"v{os.environ['RELEASE_VERSION']}":
              sys.exit("release tag does not match the requested version")
          if release.get("name") != os.environ["RELEASE_TITLE"]:
              sys.exit("release title does not match this workflow run")
          if release.get("body") != notes:
              sys.exit("release body does not match the changelog and release coverage notes")

          expected = {
              "pangloss-win-x64.exe", "pangloss-win-x64.exe.sha256",
              "pangloss-linux-x64", "pangloss-linux-x64.sha256",
              "pangloss-osx-arm64", "pangloss-osx-arm64.sha256",
              "pangloss-osx-x64", "pangloss-osx-x64.sha256",
              "pangloss.exe", "pangloss.exe.sha256",
          }
          assets = release.get("assets", [])
          names = [asset.get("name") for asset in assets]
          if len(names) != len(expected) or set(names) != expected:
              sys.exit(f"remote asset inventory differs: {sorted(names)}")
          asset_by_name = {asset["name"]: asset for asset in assets}
          for name in sorted(expected):
              local = Path(os.environ["RELEASE_ASSETS_DIR"]) / name
              asset = asset_by_name[name]
              digest = hashlib.sha256(local.read_bytes()).hexdigest()
              if asset.get("state") != "uploaded":
                  sys.exit(f"remote asset {name} is not uploaded")
              if asset.get("size") != local.stat().st_size:
                  sys.exit(f"remote asset {name} has the wrong size")
              if asset.get("digest") != f"sha256:{digest}":
                  sys.exit(f"remote asset {name} digest does not match local bytes")
          expected_draft = os.environ["EXPECTED_DRAFT"] == "true"
          if release.get("draft") is not expected_draft:
              sys.exit("release draft state differs from the expected state")
          print(f"verified {len(expected)} remote assets; draft={str(expected_draft).lower()}")
          PY

          resolve_existing_release_id() {
            local attempt
            release_id=""
            for attempt in 1 2 3 4 5; do
              gh api --paginate --slurp "$releases_endpoint" > release-pages.json
              release_id="$(python "$release_id_script" existing "$tag" < release-pages.json)"
              if [[ -n "$release_id" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep 1
              fi
            done
          }

          resolve_existing_release_id
          if [[ -z "$release_id" ]]; then
            gh api --method POST "$release_create_endpoint" \
              -F "tag_name=$tag" \
              -F "name=$RELEASE_TITLE" \
              -F "body=@$RELEASE_NOTES_PATH" \
              -F draft=true > release-created.json
            release_id="$(python "$release_id_script" created < release-created.json)"
          fi

          release_endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          gh api "$release_endpoint" > release.json
          release_state="$(python - <<'PY'
          import json, os, sys
          release = json.load(open("release.json", encoding="utf-8"))
          notes = open(os.environ["RELEASE_NOTES_PATH"], encoding="utf-8").read()
          if release.get("tag_name") != os.environ["RELEASE_TAG"]: sys.exit("release tag mismatch")
          if release.get("name") != os.environ["RELEASE_TITLE"]: sys.exit("release title mismatch")
          if release.get("body") != notes: sys.exit("release notes mismatch")
          if release.get("draft") is True: print("draft")
          elif release.get("draft") is False: print("public")
          else: sys.exit("release draft state is missing")
          PY
          )"

          if [[ "$release_state" == public ]]; then
            # The by-tag endpoint resolves published releases; use it only after publication.
            gh api "$tag_endpoint" > release.json
            export EXPECTED_DRAFT=false
            python "$RUNNER_TEMP/verify_release.py"
            echo 'release is already public with the exact expected assets; retry is complete'
            exit 0
          fi

          gh release upload "$tag" release-assets/* --clobber
          gh api "$release_endpoint" > release.json
          export EXPECTED_DRAFT=true
          python "$RUNNER_TEMP/verify_release.py"

          gh api --method PATCH "$release_endpoint" -F draft=false > release.json
          gh api "$tag_endpoint" > release.json
          export EXPECTED_DRAFT=false
          python "$RUNNER_TEMP/verify_release.py"
