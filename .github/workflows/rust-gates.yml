name: Rust gates

# The fmt, clippy and test gates shared by Rust CI and Release, so the two cannot drift. Release adds
# its version preflight and extra gates through `include_release_gates`.

on:
  workflow_call:
    inputs:
      include_release_gates:
        description: Include release version, documentation, hygiene, and conformance gates.
        required: false
        default: false
        type: boolean
      version:
        description: Release version checked by the release gates.
        required: false
        default: ''
        type: string
      source_sha:
        description: Exact release source commit. Defaults to the caller's commit for Rust CI.
        required: false
        default: ''
        type: string
      source_tag:
        description: Existing tag naming the release source, if the source ref is a tag.
        required: false
        default: ''
        type: string
      require_annotated_tag:
        description: Require source_tag to be an annotated tag naming source_sha.
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: Maximum time allowed for the test job.
        required: false
        default: 360
        type: number
env:
  CARGO_TERM_COLOR: always

jobs:
  # Release only. Runs first so a bad version costs seconds, not a full suite.
  preflight:
    name: release preflight
    if: ${{ inputs.include_release_gates }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Refuse a version that is not x.y.z
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::version must be exactly x.y.z with numeric components'
            exit 1
          fi
          echo "version $RELEASE_VERSION"
      - name: Verify the changelog section
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Fxq -- "## $RELEASE_VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $RELEASE_VERSION' section. Release notes are authored, not generated."
            exit 1
          fi
      - name: Verify main ancestry, workspace version, and tag annotation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          REQUIRE_ANNOTATED_TAG: ${{ inputs.require_annotated_tag }}
        run: |
          set -euo pipefail
          if ! git fetch --quiet origin refs/heads/main:refs/remotes/origin/main; then
            echo '::error::could not fetch origin/main to verify release ancestry'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::release source $SOURCE_SHA is not reachable from origin/main"
            exit 1
          fi

          current_version="$(awk '
            /^\[workspace\.package\]/ { in_workspace=1; next }
            /^\[/ { if (in_workspace) exit; in_workspace=0 }
            in_workspace && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' rust/Cargo.toml)"
          if [[ "$current_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::workspace version is $current_version; expected $RELEASE_VERSION from the release ref"
            exit 1
          fi

          if [[ "$REQUIRE_ANNOTATED_TAG" == true ]]; then
            if [[ -z "$SOURCE_TAG" || "$SOURCE_TAG" != "v$RELEASE_VERSION" ]]; then
              echo "::error::release tag must be v$RELEASE_VERSION"
              exit 1
            fi
            if ! git fetch --quiet --no-tags origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"; then
              echo "::error::could not fetch release tag $SOURCE_TAG from origin"
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" != tag ]]; then
              echo "::error::$SOURCE_TAG is not an annotated tag"
              exit 1
            fi
            if ! tag_sha="$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")"; then
              echo "::error::$SOURCE_TAG does not point to a commit"
              exit 1
            fi
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::$SOURCE_TAG points to $tag_sha; expected $SOURCE_SHA"
              exit 1
            fi
          fi
      - name: Set up Rust for locked metadata verification
        uses: dtolnay/rust-toolchain@stable
      - name: Refuse a stale or inconsistent Cargo.lock
        working-directory: rust
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo '::error::Cargo.lock is inconsistent with the release workspace; refresh and commit it before tagging'
            exit 1
          fi
      - name: Wait for green Rust CI on the release source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! run="$(gh run list -R "${{ github.repository }}" --workflow rust-ci.yml --commit "$SOURCE_SHA" --event push \
              --limit 1 --json status,conclusion,url --jq 'if length == 0 then "" else .[0] | "\(.status) \(.conclusion) \(.url)" end')"; then
              echo "::error::could not query Rust CI for release source $SOURCE_SHA"
              exit 1
            fi
            if [[ -n "$run" ]]; then
              read -r status conclusion url <<<"$run"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" == success ]]; then
                  echo "Rust CI green for $SOURCE_SHA: $url"
                  exit 0
                fi
                echo "::error::Rust CI for $SOURCE_SHA concluded '$conclusion' ($url)"
                exit 1
              fi
              echo "Rust CI for $SOURCE_SHA is $status; waiting ($url)"
            else
              echo "Rust CI run for $SOURCE_SHA is not visible yet; waiting"
            fi
            sleep 30
          done
          echo "::error::Rust CI for $SOURCE_SHA did not complete successfully within 60 minutes"
          exit 1

  fmt:
    name: fmt --check
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: rust
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Examples are behind each crate's `examples` feature so test builds skip them; lint them anyway.
      - working-directory: rust
        run: cargo clippy --all-targets --features pg-cli/examples --locked -- -D warnings

  test:
    name: build + test
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Fixture discovery refuses an unclaimed run; claim both roots, as `pg.ps1 -Mode test` does.
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - working-directory: rust
        run: cargo test --profile pg-test-opt --no-fail-fast --locked

  release-extras:
    name: release gates (hygiene, rustdoc, conformance)
    needs: preflight
    if: ${{ inputs.include_release_gates && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: comment hygiene
        working-directory: rust
        run: cargo run --locked -p pg-comment-hygiene -- --repo-root .. --list
      - name: rustdoc
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
      - name: conformance suite (the contract)
        run: |
          set +e
          bash rust/tools/run-conformance.sh
          exit_code=$?
          set -e
          if [ "$exit_code" = 2 ]; then
            echo "::error::run-conformance.sh exited 2 -- a harness-level error, not a conformance verdict. Fix the environment; do not re-run to get a different answer."
          fi
          exit "$exit_code"
