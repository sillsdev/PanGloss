name: Rust gates

# The fmt, clippy and test gates shared by Rust CI and Release, so the two cannot drift. Release adds
# its version preflight and extra gates through `include_release_gates`.

on:
  workflow_call:
    inputs:
      include_release_gates:
        description: Include release version, documentation, hygiene, and conformance gates.
        required: false
        default: false
        type: boolean
      version:
        description: Release version checked by the release gates.
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: Maximum time allowed for the test job.
        required: false
        default: 360
        type: number
      require_main:
        description: Require the current main tip as the source. Only a build-only dry run passes false.
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release only. Runs first so a bad version costs seconds, not a full suite.
  preflight:
    name: release preflight
    if: ${{ inputs.include_release_gates }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a version that is not x.y.z
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::version must be exactly x.y.z with numeric components'
            exit 1
          fi
          echo "version $RELEASE_VERSION"
      - name: Refuse a version CHANGELOG.md has no section for
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Fxq -- "## $RELEASE_VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $RELEASE_VERSION' section. Release notes are authored, not generated."
            exit 1
          fi
      # A dry run publishes nothing, so it may prove a branch before that branch reaches main.
      - name: Require the current main tip as the release source
        if: ${{ inputs.require_main }}
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo "::error::dispatch the Release workflow from main (got $SOURCE_REF)"
            exit 1
          fi
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$main_sha" || "$main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::workflow source $SOURCE_SHA is not the current main tip ($main_sha)"
            exit 1
          fi
      - name: Refuse a tag that already exists
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$RELEASE_VERSION already exists on origin"
            exit 1
          fi
      # Rust CI already runs fmt, clippy and the tests on every push; releasing past a red run is how
      # v0.5.0 needed three attempts. The bot's own `release: v*` stamp commits never trigger Rust CI,
      # so walk back past them to the commit CI actually judged.
      - name: Refuse a commit whose Rust CI run is not green
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          # A release is judged by main's push run; a dry run on a branch has only its pull-request run.
          RUST_CI_EVENT: ${{ inputs.require_main && 'push' || 'pull_request' }}
        run: |
          sha="$SOURCE_SHA"
          while [ "$(git log -1 --format=%an "$sha")" = "github-actions[bot]" ] \
                && git log -1 --format=%s "$sha" | grep -qE '^release: v[0-9]+\.[0-9]+\.[0-9]+$'; do
            sha="$(git rev-parse "$sha^")"
          done
          run="$(gh run list -R "${{ github.repository }}" --workflow rust-ci.yml --commit "$sha" --event "$RUST_CI_EVENT" \
                 --limit 1 --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion) \(.url)"')"
          if [ -z "$run" ]; then
            echo "::error::no Rust CI run exists for $sha; push it to main and let Rust CI finish before releasing"
            exit 1
          fi
          read -r status conclusion url <<<"$run"
          if [ "$status" != "completed" ]; then
            echo "::error::Rust CI for $sha is still $status ($url); wait for it to go green, then dispatch again"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Rust CI for $sha concluded '$conclusion' ($url); fix main before releasing"
            exit 1
          fi
          echo "Rust CI green for $sha: $url"

  fmt:
    name: fmt --check
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: rust
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Examples are behind each crate's `examples` feature so test builds skip them; lint them anyway.
      - working-directory: rust
        run: cargo clippy --workspace --all-targets --features pg-foma/examples,pg-foma-backend/examples,pg-cli/examples -- -D warnings

  test:
    name: build + test
    needs: preflight
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Fixture discovery refuses an unclaimed run; claim both roots, as `pg.ps1 -Mode test` does.
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - working-directory: rust
        run: cargo test --workspace --profile pg-test-opt --no-fail-fast

  release-extras:
    name: release gates (hygiene, rustdoc, conformance)
    needs: preflight
    if: ${{ inputs.include_release_gates && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: comment hygiene
        working-directory: rust
        run: cargo run --locked -p pg-comment-hygiene -- --repo-root .. --list
      - name: rustdoc
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
      - name: conformance suite (the contract)
        run: |
          set +e
          bash rust/tools/run-conformance.sh
          exit_code=$?
          set -e
          if [ "$exit_code" = 2 ]; then
            echo "::error::run-conformance.sh exited 2 -- a harness-level error, not a conformance verdict. Fix the environment; do not re-run to get a different answer."
          fi
          exit "$exit_code"
