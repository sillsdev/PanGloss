name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: every required job runs and reports here (no draft skip, no coverage).
  merge_group:
    types: [checks_requested]

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

# One run per pull request: a new push cancels the superseded run. Runs on main are never cancelled.
# A merge group keys on its own queue ref and never cancels: each group's run is the final gate for it.
# Pushes key on the commit, so a queued run for one commit is never replaced by a later one (release
# preflight waits for the run on its exact commit). The reusable rust-gates.yml sets no group: inside a
# called workflow github.workflow is the caller's name, so the same group would deadlock the caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the diff holds anything beyond docs. A skipped job reports success to branch
  # protection, so the jobs below skip on `code != true` instead of the workflow using `paths-ignore`
  # (a workflow that never starts leaves its required checks pending forever). Pushes to main always run.
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          code=true
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            # If the listing fails, run everything rather than fail the job.
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)') || {
              echo "::warning::could not list the pull request files; running everything"
              files=""
            }
          elif [[ "$EVENT" == merge_group ]]; then
            # The queue's own diff: everything the group adds to the base. The compare API lists at most
            # 300 files, so a listing that long may be truncated and runs everything.
            files=$(gh api "repos/$REPO/compare/$MG_BASE...$MG_HEAD" --paginate --jq '.files[] | .filename, (.previous_filename // empty)') || {
              echo "::warning::could not compare the merge group; running everything"
              files=""
            }
            if [[ $(grep -c . <<< "$files") -ge 300 ]]; then
              echo "::warning::merge group diff may be truncated; running everything"
              files=""
            fi
          fi
          if [[ -n "$files" ]]; then
            code=false
            while IFS= read -r f; do
              # Docs-only means every changed path is prose: a .md file outside rust/ or a top-level
              # LICENSE*. Other files under docs/ (tests include_str! docs/divergences/evidence/**)
              # and .md under rust/ (make_report_golden.md) are code. The .md files that tests read
              # are code too: CLAUDE.md and .claude/ (agent_docs_resolve_gate, build_command_contract),
              # docs/divergences/ (divergence_catalogue_gate), docs/diagnostics/ and
              # docs/grammar-diagnostics-reference.md (pg-grammar help paths), docs/fst-plan/ and
              # docs/research/subrecipes/ (pg-foma-backend contracts), docs/formats/ and
              # docs/grammar-facts-format.md (pg-facts).
              case "$f" in
                rust/*|CLAUDE.md|AGENTS.md|.claude/*|docs/divergences/*|docs/diagnostics/*|docs/fst-plan/*|docs/research/subrecipes/*|docs/formats/*|docs/grammar-facts-format.md|docs/grammar-diagnostics-reference.md) code=true; echo "code change: $f"; break ;;
                *.md|LICENSE*) ;;
                *) code=true; echo "code change: $f"; break ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes selected: $code"

  gates:
    name: fmt, clippy, build + test
    needs: changes
    # The called workflow's own jobs skip on run_gates=false, so each required context still reports.
    # A skipped caller would leave their names pending.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rust-gates.yml
    with:
      timeout_minutes: 360
      run_gates: ${{ needs.changes.outputs.code == 'true' }}

  linux-containment:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux containment (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PANGLOSS_CGROUP_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch the conformance suite
        uses: ./.github/actions/conformance-suite
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove delegated cgroup containment
        run: bash tools/linux-containment-ci.sh

  wasm-js-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: HC-only WASM JS smoke (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
          fallback: none
      - name: Build and run required HC smoke in a bounded managed service
        run: bash tools/linux-containment-ci.sh --wasm-js-smoke

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The Linux gates never compile cfg(windows) code; v0.8.0's Windows release build broke unseen.
    name: Windows clippy, build, tool + hard-link tests (required)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch the conformance suite
        uses: ./.github/actions/conformance-suite
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Clippy, as the Linux gate runs it
        run: cargo clippy --all-targets --features pg-cli/examples,pg-cli/cost-calibration --locked -- -D warnings
      - name: Build the release binary
        run: cargo build --release -p pg-cli --features foma-tools --locked
      - name: PowerShell tool tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/tests/run-all.ps1
      - name: Run the Windows file-identity tests
        shell: bash
        # A filter that matches nothing still passes, so require the two tests by count.
        run: |
          set -o pipefail
          cargo test --profile pg-test-opt -p pg-cli --test all --locked -- frozen_batch_hard_links | tee hard-links.log
          grep -q 'test result: ok\. 2 passed' hard-links.log
      - name: Run the result-cache deletion and marker tests
        shell: bash
        # Eviction deletes directories, so its marker rules must hold on Windows file semantics too; require the four tests by count.
        run: |
          set -o pipefail
          cargo test --profile pg-test-opt -p pg-cli --test all --locked -- result_cache_cli | tee result-cache.log
          grep -q 'test result: ok\. 4 passed' result-cache.log

  coverage:
    name: coverage (codecov)
    # Pushes to main only: it is not a required check and was the most often failing job on PRs (#378).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Same claim as the `test` job: this step runs the same default suite, so it needs the same scope.
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          # See the `test` job's checkout step: `cargo llvm-cov --workspace` below also runs the
          # default (non-ignored) suite, which includes the conformance-dependent unit
          # tests that need the suite in `conformance/` (fetched by the next step) to pass.
          submodules: true
      - name: Fetch the conformance suite
        uses: ./.github/actions/conformance-suite
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same profile as the `test` job, for the same reason: unoptimized, this suite does not finish.
      - run: cargo llvm-cov --workspace --profile pg-test-opt --no-fail-fast --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: rust/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
