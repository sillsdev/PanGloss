name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    # Fixture discovery refuses an unclaimed run rather than guess which fixtures a green run covered,
    # so this job claims what `pg.ps1 -Mode test` claims: both roots, the submodule being checked out
    # below. Claiming it here rather than defaulting in the library keeps the claim readable in the log.
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          # The `machine` submodule (sillsdev/machine, `conformance-framework` branch) carries the
          # engine-agnostic conformance fixtures under `machine/conformance/` — several fast unit
          # tests (e.g. pg-foma's `precision::tests`/`emit::structural_and_pattern_tests` modules)
          # load these directly and are NOT `#[ignore]`d, so they need the submodule present to
          # pass rather than panic on a missing file. Init it here so the test step below is
          # green. Non-recursive: `machine` itself carries no nested `.gitmodules` (verified by
          # inspecting a local checkout), so `true` fetches everything we consume
          # (`machine/conformance/`) without the extra cost/risk of recursing into any of
          # sillsdev/machine's own future submodules.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same profile as the test steps, so this warms their artifacts instead of building a debug copy
      # nothing below reuses; the dev profile is already compiled by the clippy job.
      - run: cargo build --workspace --all-targets --profile pg-test-opt
      # Default (fast, <~60s local) suite: in-crate unit tests, fixture-free integration tests,
      # and the machine/conformance-driven tests (submodule checked out above). Every test that
      # loads real-language corpus data from `samples/data/*` (gitignored, never committed —
      # docs/natural-glosses-plan.md purge policy) is unconditionally `#[ignore]`d regardless of
      # its own speed (see e.g. pg-foma/tests/f1_sena_gate.rs's module doc for the policy this
      # follows), so this step needs no corpus data checked out at all.
      #
      # `--no-fail-fast`, matching pg.ps1's own default: without it the first failing target ends the
      # run, and the count that reaches the log is a fraction of what was actually checked.
      #
      # `--profile pg-test-opt` is what `pg.ps1 -Mode test` runs, and it is not a convenience: this
      # suite is unusable unoptimized. Measured on this runner, `envelope_agrees_with_compiler_gate`
      # alone took 1026s of a debug run that was still inside pg-foma after 45 minutes, against 372s
      # for the whole 2613-test suite optimized, which is the budget the release gate is set against.
      # The profile inherits `release`, so `debug_assertions` is off here exactly as it is in the
      # mode this repo calls authoritative.
      - run: cargo test --workspace --profile pg-test-opt --no-fail-fast
      # There is deliberately no `--include-ignored` sweep here. Every `#[ignore]` in this workspace
      # marks a test whose input CI does not have -- a gitignored real-language corpus, a FieldWorks
      # project, a `wsl` oracle -- and `pg_conformance_fixtures::corpus::require` fails hard rather
      # than skipping when an explicitly requested corpus is absent, on purpose, so that a run over
      # nothing can never read as a pass. Asking for those tests in the one environment the ignores
      # exist to exclude just converts that honest refusal into permanent red. They run where the
      # data is, through `pg.ps1 -Mode corpus-test`, which declares what it covered.
      #
      # The step this replaces also existed to run the suite optimized; the step above now does that.

  linux-containment:
    name: Linux containment (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PANGLOSS_CGROUP_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove delegated cgroup containment
        run: bash tools/linux-containment-ci.sh

  coverage:
    name: coverage (codecov)
    runs-on: ubuntu-latest
    # Same claim as the `test` job: this step runs the same default suite, so it needs the same scope.
    env:
      PANGLOSS_CONFORMANCE_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          # See the `test` job's checkout step: `cargo llvm-cov --workspace` below also runs the
          # default (non-ignored) suite, which includes the machine/conformance-dependent unit
          # tests that need this submodule present to pass. Non-recursive (see that step's comment).
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same profile as the `test` job, for the same reason: unoptimized, this suite does not finish.
      - run: cargo llvm-cov --workspace --profile pg-test-opt --no-fail-fast --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: rust/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
